# Data for the provenance profile (facts, not findings). Globs work like rule globs
# (case-insensitive, '**' = any folders). File sets from the rules (`{set: name}`) can
# be used as well.

# What a maintained project usually has. Reported as present or missing.
markers:
  readme:
    label: readme
    files: ["README", "README.*"]
  license:
    label: license
    files: ["LICENSE", "LICENSE.*", "LICENCE", "LICENCE.*", "COPYING", "COPYING.*", "UNLICENSE", "LICENSES/*"]
  tests:
    label: tests
    files: ["test/**", "tests/**", "spec/**", {set: test_files}]
  ci:
    label: CI
    files: [".github/workflows/*.yml", ".github/workflows/*.yaml", ".gitlab-ci.yml", ".circleci/config.yml", ".travis.yml", "azure-pipelines.yml", "Jenkinsfile", ".buildkite/**", "appveyor.yml", ".woodpecker.yml", ".woodpecker/*"]
  docs:
    label: docs
    files: ["docs/**", "doc/**", "mkdocs.yml", ".readthedocs.yml", ".readthedocs.yaml"]
  changelog:
    label: changelog
    files: ["CHANGELOG", "CHANGELOG.*", "CHANGES", "CHANGES.*", "HISTORY", "HISTORY.*", "NEWS", "NEWS.*", "RELEASE_NOTES*"]
  contributing:
    label: contributing guide
    files: ["CONTRIBUTING", "CONTRIBUTING.*", ".github/CONTRIBUTING.*", "docs/CONTRIBUTING.*"]
  security_policy:
    label: security policy
    files: ["SECURITY", "SECURITY.*", ".github/SECURITY.*", "docs/SECURITY.*"]
  code_of_conduct:
    label: code of conduct
    files: ["CODE_OF_CONDUCT.*", ".github/CODE_OF_CONDUCT.*", "docs/CODE_OF_CONDUCT.*"]
  codeowners:
    label: code owners
    files: ["CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS"]
  dependency_updates:
    label: dependency update bot
    files: [".github/dependabot.yml", ".github/dependabot.yaml", "renovate.json", "renovate.json5", ".renovaterc", ".renovaterc.json", ".github/renovate.json", ".github/renovate.json5"]

# Files worth knowing about before working with a repository (listed with paths).
# `exclude` leaves out paths that match another list.
notable:
  agent_files:
    label: AI agent files
    files: [{set: agent_files}]
  skill_files:
    label: agent skills outside the folders agents load them from
    files: [{set: skill_files}]
    exclude: [{set: agent_files}]
  dev_container:
    label: dev container
    files: [".devcontainer/**", ".devcontainer.json"]
  editor_config:
    label: editor and IDE settings
    files: [".vscode/**", ".idea/**", ".zed/**", "*.code-workspace"]
  git_hooks:
    label: Git hook managers and hook folders
    files: [".githooks/**", ".husky/**", ".pre-commit-config.yaml", "lefthook.yml", ".lefthook.yml"]
  containers:
    label: container builds
    files: ["**/Dockerfile", "**/Dockerfile.*", "**/*.dockerfile", "**/Containerfile", "**/docker-compose.yml", "**/docker-compose.yaml", "**/compose.yml", "**/compose.yaml"]
  manifests:
    label: package manifests
    files: [{set: dependency_manifests}, "**/Cargo.toml", "**/go.mod", "**/composer.json", "**/Gemfile", "**/*.gemspec", "**/pom.xml", "**/build.gradle", "**/build.gradle.kts", "**/*.csproj"]
  workflows:
    label: CI workflows
    files: [".github/workflows/*.yml", ".github/workflows/*.yaml"]

# A file counts as generated if its first lines contain one of these markers.
generated_header: "(?i)@generated\\b|\\bdo not edit\\b|\\bauto-?generated\\b|\\bcode generated by\\b|\\bthis file (?:is|was) generated\\b"

# License texts recognised by distinctive phrases (lowercase, whitespace collapsed).
# The first entry whose phrases all occur (and none of `unless`) wins. A text match is
# an indicator, not a legal review.
licenses:
  - {id: AGPL-3.0, all: ["gnu affero general public license"]}
  - {id: LGPL-3.0, all: ["gnu lesser general public license", "version 3"]}
  - {id: LGPL-2.1, all: ["gnu lesser general public license", "version 2.1"]}
  - {id: LGPL-2.0, all: ["gnu library general public license"]}
  - {id: GPL-3.0, all: ["gnu general public license", "version 3"]}
  - {id: GPL-2.0, all: ["gnu general public license", "version 2"]}
  - {id: Apache-2.0, all: ["apache license", "version 2.0"]}
  - {id: MPL-2.0, all: ["mozilla public license", "2.0"]}
  - {id: EPL-2.0, all: ["eclipse public license", "2.0"]}
  - {id: BSL-1.0, all: ["boost software license"]}
  - {id: MIT, all: ["permission is hereby granted, free of charge, to any person obtaining a copy"]}
  - {id: ISC, all: ["permission to use, copy, modify, and/or distribute this software for any purpose"]}
  - {id: ISC, all: ["permission to use, copy, modify, and distribute this software for any purpose with or without fee"]}
  - {id: BSD-3-Clause, all: ["redistribution and use in source and binary forms", "neither the name"]}
  - {id: BSD-3-Clause, all: ["redistribution and use in source and binary forms", "names of its contributors may"]}
  - {id: BSD-2-Clause, all: ["redistribution and use in source and binary forms"]}
  - {id: Unlicense, all: ["this is free and unencumbered software released into the public domain"]}
  - {id: CC0-1.0, all: ["cc0 1.0 universal"]}
  - {id: Zlib, all: ["altered source versions must be plainly marked as such"]}
  - {id: WTFPL, all: ["do what the fuck you want to public license"]}

# Where manifests declare a license (relative to the repository root only).
declared_license:
  - {file: pyproject.toml, format: toml, paths: [project.license, project.license.text, tool.poetry.license]}
  - {file: package.json, format: json, paths: [license]}
  - {file: Cargo.toml, format: toml, paths: [package.license]}
  - {file: composer.json, format: json, paths: [license]}

# AI tools named in commit messages (co-author trailers, "Generated with" lines) or as
# the commit author. Matched against the message (first 64 KiB) and "Name <email>".
# A match is an indicator: trailers and authors are free text and can be added or
# removed by anyone.
ai_markers:
  - tool: Claude Code
    message: "(?im)^co-authored-by:[^\\n]*(?:\\bclaude\\b|noreply@anthropic\\.com)|generated with \\[?claude code\\b"
  - tool: GitHub Copilot
    message: "(?im)^co-authored-by:[^\\n]*\\bcopilot\\b"
    author: "(?i)\\bcopilot(?:-swe-agent)?(?:\\[bot\\])? *<"
  - tool: Cursor
    message: "(?im)^co-authored-by:[^\\n]*(?:cursor ?agent|cursoragent@cursor\\.com)"
    author: "(?i)<cursoragent@cursor\\.com>"
  - tool: aider
    message: "(?im)^aider: |^co-authored-by:[^\\n]*\\baider\\b"
  - tool: Devin
    message: "(?im)^co-authored-by:[^\\n]*devin-ai"
    author: "(?i)devin-ai-integration"
  - tool: OpenAI Codex
    message: "(?im)^co-authored-by:[^\\n]*\\b(?:chatgpt-)?codex\\b"
    author: "(?i)\\bchatgpt-codex-connector\\b"
  - tool: Gemini
    message: "(?im)^co-authored-by:[^\\n]*\\bgemini\\b"
    author: "(?i)gemini-code-assist|google-labs-jules"
  - tool: OpenHands
    message: "(?im)^co-authored-by:[^\\n]*openhands"
    author: "(?i)openhands@all-hands\\.dev"
  - tool: Amazon Q
    message: "(?im)^co-authored-by:[^\\n]*amazon[ -]q\\b"
    author: "(?i)amazon-q-developer"
