# Area obfuscation (RC-OBF): code that hides what it does.
# Only source and script files (code_files); data, documentation and notebooks carry
# encoded media legitimately. Build output and vendored code are excluded where long
# lines and blobs are normal.

- id: RC-OBF-001
  title: Long encoded blob in source code
  area: obfuscation
  severity: medium
  confidence: low
  files: [{set: code_files}]
  exclude: [{set: vendored}, {set: generated}, {set: test_files}]
  check:
    type: blob
    encoding: base64
    min_length: 300
    min_entropy: 5.0
    # Blobs that decode to code are reported by RC-OBF-002 instead.
    not_decoded_regex: "{{decoded_code}}"
  message: "Base64 blob of {count} characters in code; decodes to: {decoded}"
  rationale: >
    Long Base64 strings in source code can carry a hidden payload (an encrypted or
    compressed program, a second stage) that is decoded at run time. Embedded images,
    fonts and data URIs are not reported; test data and keys are common false alarms.
  recommendation: >
    Find out where the string is used. If it is decoded and executed, loaded as a
    library or written to disk, treat the repository as untrusted.
  tags: [obfuscation, base64]

- id: RC-OBF-002
  title: Encoded blob in source code decodes to code or commands
  area: obfuscation
  severity: high
  confidence: high
  files: [{set: code_files}]
  exclude: [{set: vendored}, {set: test_files}]
  check:
    type: blob
    encoding: [base64, hex]
    min_length: 40
    decoded_regex: "{{decoded_code}}"
  message: "Encoded string ({count} characters) decodes to code: {decoded}"
  rationale: >
    Code stored in Base64 or hex form cannot be read or reviewed in the source and is
    usually decoded and executed at run time. Malware uses this to hide its real
    behaviour from people and from scanners.
  recommendation: >
    Do not run, install or build this repository until you know what the decoded code
    does and where it is executed.
  references:
    - https://attack.mitre.org/techniques/T1027/
  tags: [obfuscation, base64, hex]

- id: RC-OBF-003
  title: Code is decoded and executed in one step
  area: obfuscation
  severity: high
  confidence: high
  # Also autotools build files: configure scripts and m4 macros run during the build.
  files: [{set: code_files}, "**/*.m4", "**/configure", "**/configure.ac", "**/configure.in", "**/Makefile.am", "**/Makefile.in"]
  exclude: [{set: vendored}, {set: test_files}]
  check:
    type: regex
    demote_regex_literals: true
    ignore: "{{comment_line}}"
    # Every alternative contains a decoder or decompressor name; files without one are
    # skipped.
    prefilter: [b64decode, b32decode, b16decode, b85decode, a85decode, decodebytes, decodestring,
      decompress, unhexlify, fromhex, loads, codecs.decode, __import__, atob, unescape,
      decodeuricomponent, buffer.from, fromcharcode, frombase64string, base64, xz, lzma,
      gzip, gunzip, bzip2, bunzip2, bzcat, zstd, zcat, lzcat, lz4, brotli]
    # Decoders inside exec/eval/new Function, inside child_process, subprocess or os.system
    # calls (Buffer.from only with a base64 or hex encoding), PowerShell, and shell
    # pipelines that decode or decompress straight into a shell.
    pattern: >-
      (?i:\b(?:execSync|execFileSync|spawnSync|spawn|execFile|exec|subprocess\.(?:run|call|check_call|check_output|Popen|getoutput|getstatusoutput)|os\.(?:system|popen))[ \t]*\([ \t]*(?:atob[ \t]*\(|Buffer\.from[ \t]*\([^\n]{0,2000}?["'](?:base64|base64url|hex)["']|(?:[\w.]+\.)?(?:b64decode|b32decode|b16decode|b85decode|a85decode|decodebytes|unhexlify|fromhex|decompress)[ \t]*\(|codecs\.decode[ \t]*\())|(?i:\b(?:(?:xz|lzma|gzip|bzip2|zstd|lz4|brotli)[ \t]+(?:-[A-Za-z]*d[A-Za-z]*|--decompress)\b|(?:unxz|unlzma|gunzip|bunzip2|unzstd|zcat|xzcat|lzcat|bzcat|zstdcat)\b)[^\n|]{0,120}\|[ \t]*(?:sudo[ \t]+)?(?:/(?:usr/)?bin/)?(?:(?:ba|z|da|k)?sh|eval)\b)|(?i:\b(?:exec|eval)[ \t]*\([ \t]*(?:compile[ \t]*\([ \t]*)?(?:__import__[ \t]*\(|(?:[\w.]+\.)?(?:b64decode|b32decode|b16decode|b85decode|a85decode|decodebytes|decodestring|decompress|unhexlify|fromhex|loads)[ \t]*\(|codecs\.decode[ \t]*\())|(?i:\beval[ \t]*\([ \t]*(?:atob|unescape|decodeURIComponent|Buffer\.from|String\.fromCharCode)[ \t]*\()|(?i:\bnew[ \t]+Function[ \t]*\([ \t]*(?:atob|unescape|Buffer\.from|String\.fromCharCode)[ \t]*\()|(?i:\b(?:iex|Invoke-Expression)\b[^\n]{0,120}\bFromBase64String\b|\bFromBase64String\b[^\n]{0,200}\|[ \t]*(?:iex|Invoke-Expression)\b)|(?i:\bpowershell(?:\.exe)?\b[^\n]{0,80}[ \t]-(?:e|ec|en|enc|encodedcommand)[ \t]+[A-Za-z0-9+/]{40,}={0,2})|(?i:\bbase64[ \t]+(?:-d|--decode|-D)\b[^\n]{0,80}\|[ \t]*(?:sudo[ \t]+)?(?:ba|z|da|k)?sh\b)|(?i:\b(?:eval|(?:ba|z|da|k)?sh[ \t]+-c)[ \t]+["']?\$\([^\n]{0,80}\bbase64[ \t]+(?:-d|--decode|-D)\b)
  message: "Decodes and executes code: {match}"
  rationale: >
    Executing the result of a Base64, hex or compression decoder in the same expression
    is the classic way to hide a payload: the code that actually runs is not visible
    in the file.
  recommendation: >
    Decode the string by hand (never run it) and read what it does. Do not run this
    code until you understand it.
  references:
    - https://attack.mitre.org/techniques/T1140/
  tags: [obfuscation, exec]

- id: RC-OBF-004
  title: JavaScript obfuscator or packer output
  area: obfuscation
  severity: high
  confidence: medium
  files:
    - "**/*.js"
    - "**/*.mjs"
    - "**/*.cjs"
    - "**/*.jsx"
    - "**/*.ts"
    - "**/*.html"
    - "**/*.htm"
    - "**/*.vue"
    - "**/*.svelte"
    - "**/*.hta"
  exclude: [{set: vendored}, {set: test_files}]
  check:
    type: regex
    long_lines: true
    prefilter: [_0x, eval, "[]"]
    pattern: >-
      \b(?:var|let|const|function)[ \t]+_0x[0-9a-f]{4,6}\b|\bfunction[ \t]*\([ \t]*_0x[0-9a-f]{4,6}[ \t]*,[ \t]*_0x[0-9a-f]{4,6}\b|\beval[ \t]*\([ \t]*function[ \t]*\([ \t]*p[ \t]*,[ \t]*a[ \t]*,[ \t]*c[ \t]*,[ \t]*k[ \t]*,[ \t]*e[ \t]*,[ \t]*[dr][ \t]*\)|[\[\]()!+]{300,}
  message: "Obfuscated JavaScript: {match}"
  rationale: >
    Identifiers like _0x1a2b, the p,a,c,k,e,d packer and JSFuck are produced by
    obfuscation tools. Legitimate projects ship readable or merely minified code;
    obfuscation is a common trait of malicious packages.
  recommendation: >
    Do not run or install this code. If it should be a third-party library, compare it
    with the official release.
  references:
    - https://attack.mitre.org/techniques/T1027/
  tags: [obfuscation, javascript]

- id: RC-OBF-005
  title: String built from a long chain of character codes
  area: obfuscation
  severity: high
  confidence: medium
  files: [{set: code_files}]
  exclude: [{set: vendored}, {set: generated}, {set: test_files}]
  check:
    type: regex
    ignore: "{{comment_line}}"
    long_lines: true
    prefilter: [fromcharcode, chr, "[char]"]
    pattern: >-
      \bString\.fromCharCode[ \t]*\((?:[ \t]*(?:0x[0-9a-fA-F]{1,4}|\d{1,5})[ \t]*,){15,}|(?:\bchr[ \t]*\([ \t]*\d{1,5}[ \t]*\)[ \t]*\+[ \t]*){15,}|(?i:(?:\[char\][ \t]*\d{1,5}[ \t]*[,+][ \t]*){15,})
  message: "Text assembled from character codes: {match}"
  rationale: >
    Building strings from dozens of numeric character codes hides URLs, commands or
    code from readers and simple searches.
  recommendation: >
    Convert the numbers to text by hand (never run the code) and check what the
    string contains and where it is used.
  references:
    - https://attack.mitre.org/techniques/T1027/
  tags: [obfuscation]

- id: RC-OBF-006
  title: Very long line in source code
  area: obfuscation
  severity: medium
  confidence: low
  files: [{set: code_files}]
  exclude: [{set: vendored}, {set: generated}, {set: test_files}]
  check:
    type: blob
    encoding: none
    min_length: 5000
    # Only lines shaped like code: at least 6 % of ;(){}= and at most 80 % inside string
    # literals. Long prose strings, SVG paths, keyword lists and data tables are not
    # reported (minified code measures 7-16 %, those lines 0-4 % or over 85 % strings).
    min_code_density: 0.06
    max_string_share: 0.8
    # Generated files say so in their first lines.
    skip_header_regex: '(?i:@generated\b|\bdo not (?:edit|modify)\b|\bauto-?generated\b|\b(?:code|file) (?:was |is )?generated\b|\bgenerated by\b)'
  message: "Line of {count} characters in a source file: {match}"
  rationale: >
    Lines this long are not reviewed by people. Outside build output they can hide a
    minified payload in a file that otherwise looks normal. Only lines that look like
    dense code are reported; long text strings and data tables are not. Vendored
    minified libraries are a common harmless cause.
  recommendation: >
    Check whether the file is generated or vendored. If not, look at the full line
    with a viewer that wraps text.
  tags: [obfuscation, minified]

- id: RC-OBF-007
  title: Code pushed out of view by a long run of spaces
  area: obfuscation
  severity: high
  confidence: medium
  files: [{set: code_files}]
  exclude: [{set: vendored}, {set: generated}, {set: test_files}]
  check:
    type: regex
    pattern: '\S[ \t]{150,}\S'
  message: "Code continues after a run of 150 or more spaces or tabs on this line"
  rationale: >
    Editors and web views show the start of the line; code after a long run of
    spaces is far to the right and easily missed in review. Malicious packages use
    this to hide an extra statement behind a harmless one.
  recommendation: >
    Scroll to the end of the line or view the file with wrapped lines and read what
    follows the spaces.
  tags: [obfuscation, whitespace]

- id: RC-OBF-008
  title: Bidirectional control characters in source code (Trojan Source)
  area: obfuscation
  severity: high
  confidence: high
  files: [{set: code_files}]
  exclude: [{set: vendored}, {set: test_files}]
  check:
    type: unicode
    ranges: ["202A-202E", "2066-2069"]
  message: "{count} bidirectional control character(s) change how this line is displayed"
  rationale: >
    Bidi override and isolate characters make source code appear in a different order
    than the compiler or interpreter reads it, so reviewed code can behave differently
    from what is shown (CVE-2021-42574).
  recommendation: >
    View the line with visible control characters. Remove the characters or, inside
    string literals, replace them with escapes.
  references:
    - https://trojansource.codes/
  tags: [unicode, trojan-source]

- id: RC-OBF-009
  title: Invisible characters in source code
  area: obfuscation
  severity: medium
  confidence: medium
  files: [{set: code_files}]
  exclude: [{set: vendored}, {set: test_files}]
  check:
    type: unicode
    ranges: ["180E", "200B-200D", "2060-2064", "FEFF"]
    # Joiners inside emoji sequences and in joining scripts (Arabic, Indic) are normal.
    ignore_between: [emoji, "0600-06FF", "0750-077F", "08A0-08FF", "0900-0DFF", "FB50-FDFF", "FE70-FEFC"]
  message: "{count} invisible character(s) in source code"
  rationale: >
    Zero-width characters are invisible in editors. In identifiers they create names
    that look identical but differ ("homoglyph" attacks); in strings they can hide
    data. Programs that process text sometimes contain them on purpose.
  recommendation: >
    Show the line with visible control characters. Replace intended characters with
    escapes such as \u200b and remove the others.
  references:
    - https://trojansource.codes/
  tags: [unicode, invisible]

- id: RC-OBF-010
  title: Name mixes Latin letters with look-alike letters from another script
  area: obfuscation
  severity: medium
  confidence: high
  files: [{set: code_files}]
  exclude:
    - {set: vendored}
    - {set: test_files}
    # Translations mix scripts by nature (Qt Linguist .ts files are XML, not TypeScript).
    - "**/translations/**"
    - "**/i18n/**"
    - "**/l10n/**"
    - "**/locale/**"
    - "**/locales/**"
  check:
    type: unicode
    mode: mixed_script
    # Identifiers only: comments are skipped, and string literals count only for URLs,
    # host names, e-mail addresses and module names (translated text and names in test
    # data are written in their own script, sometimes with a stray letter).
    code_only: true
  message: "A name in source code contains look-alike letters: {chars}"
  rationale: >
    Cyrillic, Greek and Armenian letters such as U+0430, U+0435 or U+03BF look exactly like
    Latin letters. Mixed into a name, they create an identifier, URL or module name that
    looks like a familiar one but is a different one (homoglyph attack), for example a
    second function that shadows the real one. Text in comments and ordinary strings is
    not reported.
  recommendation: >
    Show the line with code points (for example with a hex view) and replace the
    look-alike letters, unless the mix is intended text.
  references:
    - https://trojansource.codes/
    - https://www.unicode.org/reports/tr39/
  tags: [unicode, homoglyph]

# --- M7.5 ------------------------------------------------------------------------------

- id: RC-OBF-011
  title: Decrypted data is compiled and run as code
  area: obfuscation
  severity: high
  confidence: medium
  files: [{set: code_files}]
  # Minified files are checked: the event-stream payload sat in index.min.js.
  exclude: [{set: vendored}, {set: test_files}]
  check:
    type: regex
    ignore: "{{comment_line}}"
    prefilter: [_compile, module.constructor, runinthiscontext, runinnewcontext, runincontext,
      compilefunction, vm.script]
    # Node's module compiler or vm in a file that also decrypts something. Require hooks
    # (ts-node, babel) compile modules too, but do not decrypt them first.
    pattern: '\._compile[ \t]*\(|\bnew[ \t]+module\.constructor\b|\bvm\.(?:runInThisContext|runInNewContext|runInContext|compileFunction)[ \t]*\(|\bnew[ \t]+vm\.Script[ \t]*\('
    file_requires: ['\bcreateDecipher(?:iv)?[ \t]*\(']
  message: "Data decrypted in this file is compiled as code: {match}"
  rationale: >
    Decrypting data and handing the result to Node's module compiler or vm runs code
    that cannot be read in the repository; the key often comes from the environment so
    that the payload only unpacks in one target project. This is how the event-stream
    backdoor loaded its payload.
  recommendation: >
    Do not install or run this package. Find out what is decrypted and with which key
    without running the code.
  references:
    - https://github.com/advisories/GHSA-mh6f-8j2x-4483
    - https://attack.mitre.org/techniques/T1140/
  tags: [obfuscation, exec, javascript]
