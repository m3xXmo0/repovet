# --- M2e: Windows, Git, CI, MSBuild ------------------------------------------------------

- id: RC-AUTO-051
  title: Windows shortcut in the repository
  area: autorun
  severity: medium
  confidence: high
  files: ["**/*.lnk"]
  exclude: [{set: vendored}]
  check:
    type: filename
  message: "{path} is a Windows shortcut that can start any program"
  rationale: >
    A shortcut runs its target with arguments when double-clicked and can look like a
    document. Source repositories rarely need one.
  recommendation: >
    Do not open it. Inspect its target with a tool that shows shortcut properties.
  references:
    - https://attack.mitre.org/techniques/T1204/002/
  tags: [windows]

# --- Linux and macOS -------------------------------------------------------------------

- id: RC-AUTO-052
  title: Linux desktop entry downloads or decodes code
  area: autorun
  severity: high
  confidence: high
  files: ["**/*.desktop"]
  exclude: [{set: vendored}]
  check:
    type: regex
    pattern: '\A[ \t]*(?:Exec|TryExec)[ \t]*=[^\n]*?(?:{{fetch_or_run}})'
  message: "Desktop entry runs a command that fetches or decodes code: {match}"
  rationale: >
    Linux file managers start the Exec command of a desktop entry when it is
    double-clicked, and show its Name and Icon instead of the file name, so it can look
    like a document. This command loads code from the network or decodes a payload.
  recommendation: >
    Do not open or launch the file. Read its Exec line in a text editor.
  references:
    - https://specifications.freedesktop.org/desktop-entry-spec/latest/exec-variables.html
    - https://attack.mitre.org/techniques/T1204/002/
  platforms: [linux]
  tags: [linux, download]

- id: RC-AUTO-053
  title: macOS Terminal script (.command)
  area: autorun
  severity: medium
  confidence: high
  files: ["**/*.command"]
  exclude: [{set: vendored}]
  check:
    type: filename
  message: "{path} runs in Terminal when double-clicked in Finder"
  rationale: >
    Finder opens .command files in Terminal and runs them as shell scripts. Files from a
    Git clone carry no quarantine flag, so Gatekeeper does not ask before they run.
  recommendation: >
    Do not double-click it. Read it in a text editor first.
  references:
    - https://attack.mitre.org/techniques/T1204/002/
  platforms: [macos]
  tags: [macos]

- id: RC-AUTO-054
  title: macOS Terminal settings file runs a command
  area: autorun
  severity: high
  confidence: high
  files: ["**/*.terminal"]
  exclude: [{set: vendored}]
  check:
    type: regex
    pattern: '(?i:<key>[ \t]*CommandString[ \t]*</key>[ \t\r\n]{0,200}<string>[^<]{0,200})'
    scope: text
  message: "Terminal settings file starts a command when opened: {match}"
  rationale: >
    Opening a .terminal file in Finder opens a Terminal window with these settings, and
    CommandString is run in it right away.
  recommendation: >
    Do not open the file. Read the string after CommandString in a text editor.
  references:
    - https://attack.mitre.org/techniques/T1204/002/
  platforms: [macos]
  tags: [macos]

- id: RC-AUTO-055
  title: macOS location file opens something other than a web page
  area: autorun
  severity: medium
  confidence: high
  files: ["**/*.webloc", "**/*.inetloc", "**/*.fileloc"]
  exclude: [{set: vendored}]
  check:
    type: regex
    pattern: '(?i:<string>[ \t]*(?!(?:https?|mailto):)[a-z][a-z0-9+.-]{0,30}:[^<\n]{0,200})'
    file_requires: ['(?i:<key>[ \t]*URL[ \t]*</key>)']
  message: "Location file opens a non-web target when double-clicked: {match}"
  rationale: >
    Finder opens the URL of a .webloc, .inetloc or .fileloc file on double-click.
    file:, smb: and similar URLs open local programs or connect to a remote share
    instead of showing a web page.
  recommendation: >
    Do not open the file. Read the URL in a text editor.
  references:
    - https://attack.mitre.org/techniques/T1204/001/
  platforms: [macos]
  tags: [macos]

- id: RC-AUTO-056
  title: macOS application bundle in the repository
  area: autorun
  severity: medium
  confidence: high
  files: ["**/*.app/Contents/Info.plist"]
  exclude: [{set: vendored}]
  check:
    type: filename
  message: "{path} belongs to an application that starts when double-clicked"
  rationale: >
    An .app folder is a program for Finder. It can contain compiled code or scripts,
    and files from a Git clone carry no quarantine flag, so Gatekeeper does not check
    it before it runs. Source repositories rarely need one.
  recommendation: >
    Do not open it. Build the application from source or get it from the project's
    official releases.
  references:
    - https://attack.mitre.org/techniques/T1204/002/
  platforms: [macos]
  tags: [macos, binary]

- id: RC-AUTO-033
  title: .gitattributes assigns a custom filter, diff or merge driver
  area: autorun
  severity: low
  confidence: medium
  files: ["**/.gitattributes", "**/.git/info/attributes"]
  exclude: [{set: vendored}]
  check:
    type: regex
    ignore: '\A[ \t]*#'
    pattern: '(?<![\w-])(?:filter|diff|merge)=(?!lfs\b|binary\b|text\b|union\b|java\b|python\b|cpp\b|csharp\b|css\b|html\b|golang\b|rust\b|php\b|ruby\b|markdown\b|bash\b)[\w.-]+'
  message: "Git driver assigned: {match}"
  rationale: >
    The driver itself is a command in a Git configuration, not in the repository. It
    only runs if you (or an install script or README) configure it; then Git runs it on
    checkout, diff or merge.
  recommendation: >
    Do not add a Git configuration for this driver unless you have read what it runs.
  references:
    - https://git-scm.com/docs/gitattributes#_filter
  tags: [git]

- id: RC-AUTO-060
  title: GitHub workflow runs pull request code with pull_request_target
  area: autorun
  severity: medium
  confidence: medium
  files: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
  check:
    type: regex
    pattern: '\bref:[ \t]*["'']?\$\{\{[ \t]*(?:github\.event\.pull_request\.head\.(?:sha|ref)|github\.head_ref)\b|\bgh[ \t]+pr[ \t]+checkout\b'
    file_requires: ['\bpull_request_target\b']
  message: "Checks out the pull request in a privileged workflow: {match}"
  rationale: >
    pull_request_target runs with the repository's secrets and write token. Checking
    out and building the pull request's code there lets any outside contributor run
    code with those rights ("pwn request"). This affects the repository's maintainers
    and users of its releases, not your machine directly.
  recommendation: >
    Treat releases built by this workflow with care. Maintainers should use
    pull_request or keep untrusted code away from secrets.
  references:
    - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  tags: [ci, github-actions]

- id: RC-AUTO-061
  title: GitHub workflow runs an encoded command
  area: autorun
  severity: medium
  confidence: medium
  files: [".github/workflows/*.yml", ".github/workflows/*.yaml", "**/action.yml", "**/action.yaml"]
  exclude: [{set: vendored}]
  check:
    type: regex
    ignore: '\A[ \t]*#'
    # Decoding into a file (certificates, API content) is common; only decoding
    # straight into a shell, eval or PowerShell is reported.
    pattern: >-
      (?i:\bbase64[ \t]+(?:-d|--decode|-D)\b[^\n]{0,80}\|[ \t]*(?:sudo[ \t]+)?(?:ba|z|da|k)?sh\b|\b(?:eval|(?:ba|z|da|k)?sh[ \t]+-c)[ \t]+["']?\$\([^\n]{0,80}\bbase64[ \t]+(?:-d|--decode|-D)\b|\bpowershell(?:\.exe)?\b[^\n]{0,80}[ \t]-(?:e|ec|en|enc|encodedcommand)[ \t]+[A-Za-z0-9+/]{40,}|\bFromBase64String\b[^\n]{0,200}\|[ \t]*(?:iex|Invoke-Expression)\b)
  message: "Decodes and runs a payload in CI: {match}"
  rationale: >
    Decoding Base64 or encoded PowerShell inside a workflow hides what the CI job runs
    from reviewers. Workflows run on GitHub's machines, but they can publish releases
    and use the repository's secrets.
  recommendation: >
    Decode the value by hand and check what the step runs.
  references:
    - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
  tags: [ci, github-actions, obfuscation]

- id: RC-AUTO-062
  title: GitHub workflow puts untrusted event text into a shell command
  area: autorun
  severity: medium
  confidence: high
  files: [".github/workflows/*.yml", ".github/workflows/*.yaml", "**/action.yml", "**/action.yaml"]
  exclude: [{set: vendored}]
  check:
    type: keypath
    format: yaml
    # Workflows started by events that run with the repository's secrets and write token
    # while outsiders control the text (pull_request_target, issue and discussion
    # events, comments, workflow_run), and composite actions, whose callers may be such
    # workflows. A plain pull_request from a fork has neither secrets nor write access.
    file_requires: ['\b(?:pull_request_target|issue_comment|discussion_comment|workflow_run)\b|(?m:^[ \t]*(?:issues|discussion)[ \t]*:[ \t]*(?:#[^\n]*)?$)|(?m:^["'']?on["'']?:[^\n]*\b(?:issues|discussion)\b)|(?m:^[ \t]*-[ \t]*(?:issues|discussion)[ \t]*$)|\busing:[ \t]*["'']?composite\b']
    # run steps and github-script code; env values (the safe way) are not reported.
    paths: ["jobs.*.steps.*.run", "jobs.*.steps.*.with.script", "runs.steps.*.run"]
    value_regex: '\$\{\{[^}]{0,200}?\bgithub\.(?:head_ref|event\.(?:issue\.(?:title|body)|pull_request\.(?:title|body|head\.(?:ref|label|repo\.default_branch))|comment\.body|review(?:_comment)?\.body|discussion\.(?:title|body)|pages\.[\w*\[\]]{1,10}\.page_name|(?:commits\.[\w*\[\]]{1,10}|head_commit)\.(?:message|author\.(?:email|name))|workflow_run\.(?:head_branch|display_title|head_commit\.(?:message|author\.(?:email|name)))))\b'
  message: "Untrusted text is inserted into a script: {match}"
  rationale: >
    GitHub replaces ${{ }} expressions before the shell starts, so a pull request title,
    branch name, issue or comment text becomes part of the command. Anyone who can open
    a pull request or an issue can then run commands with the workflow's secrets and
    write token (expression injection). This affects the repository's maintainers and
    users of its releases, not your machine directly.
  recommendation: >
    Treat releases built by this workflow with care. Maintainers should pass the value
    through an environment variable (env:) and quote it in the script.
  references:
    - https://securitylab.github.com/resources/github-actions-untrusted-input/
    - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
  tags: [ci, github-actions, injection]

- id: RC-AUTO-070
  title: MSBuild project runs a command on build
  area: autorun
  severity: medium
  confidence: high
  files: [{set: msbuild_files}]
  exclude: [{set: vendored}]
  check:
    type: regex
    scope: text
    # Exec tasks, and pre- and post-build events of Visual Studio projects (the command
    # directly or in a <Command> element); empty events are not reported.
    pattern: '<Exec\b[^>]{0,500}?\bCommand[ \t]*=[ \t]*"[^"]{1,300}|<(?:Pre|Post)BuildEvent>[ \t\r\n]*(?:<Command>[ \t\r\n]*)?[^<\s][^<]{0,300}'
  message: "Build runs a command: {match}"
  rationale: >
    MSBuild runs Exec tasks and pre- and post-build events during builds, including
    builds that Visual Studio and other IDEs start in the background after opening the
    project.
  recommendation: >
    Read the command and the target it belongs to before opening the project in an IDE
    or building it.
  references:
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/exec-task
  tags: [msbuild, build]

- id: RC-AUTO-071
  title: MSBuild project downloads or decodes code during the build
  area: autorun
  severity: high
  confidence: high
  files: [{set: msbuild_files}]
  exclude: [{set: vendored}]
  check:
    type: regex
    scope: text
    pattern: '<Exec\b[^>]{0,500}?\bCommand[ \t]*=[ \t]*"[^"]{0,300}?(?:{{fetch_or_run}})|<(?:Pre|Post)BuildEvent>[ \t\r\n]*(?:<Command>)?[^<]{0,300}?(?:{{fetch_or_run}})|<DownloadFile\b'
  message: "Build fetches or runs remote code: {match}"
  rationale: >
    The build downloads something, pipes into an interpreter or decodes a payload, so
    what runs is not in the repository. Builds can start automatically when the project
    is opened in an IDE.
  recommendation: >
    Do not open or build the project until you have read the target and its download.
  references:
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/exec-task
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/downloadfile-task
  tags: [msbuild, build, download]

- id: RC-AUTO-072
  title: MSBuild inline task with code
  area: autorun
  severity: high
  confidence: medium
  files: [{set: msbuild_files}]
  exclude: [{set: vendored}]
  check:
    type: regex
    scope: text
    pattern: '<UsingTask\b[^>]{0,500}?\bTaskFactory[ \t]*=[ \t]*"(?:RoslynCodeTaskFactory|CodeTaskFactory)"'
  message: "Project defines an inline C#/VB task: {match}"
  rationale: >
    Inline tasks contain source code that MSBuild compiles and runs during the build,
    a known way to run arbitrary code when a project is built or loaded.
  recommendation: >
    Read the <Code> element of the task before building or opening the project.
  references:
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/msbuild-roslyncodetaskfactory
  tags: [msbuild, build]

# --- PHP, Rust, Gradle, Ruby ----------------------------------------------------------

- id: RC-AUTO-080
  title: Composer install or update script present
  area: autorun
  severity: medium
  confidence: high
  files: ["**/composer.json"]
  exclude: [{set: vendored}, {set: test_data}, "**/vendor/**"]
  check:
    type: keypath
    format: json
    paths:
      - scripts.pre-install-cmd
      - scripts.post-install-cmd
      - scripts.pre-update-cmd
      - scripts.post-update-cmd
      - scripts.pre-autoload-dump
      - scripts.post-autoload-dump
      - scripts.post-root-package-install
      - scripts.post-create-project-cmd
  message: "composer.json defines a '{key}' script: {value}"
  rationale: >
    Composer runs these scripts of the root package automatically during `composer
    install`, `composer update` or `composer create-project` in this folder, with your
    user rights.
  recommendation: >
    Read the script and every file or class it calls before installing. To install
    without running scripts, use `composer install --no-scripts`.
  references:
    - https://getcomposer.org/doc/articles/scripts.md
  tags: [php, composer, install]

- id: RC-AUTO-081
  title: Composer script downloads or executes code
  area: autorun
  severity: high
  confidence: high
  files: ["**/composer.json"]
  exclude: [{set: vendored}, {set: test_data}, "**/vendor/**"]
  check:
    type: keypath
    format: json
    paths: ["scripts.*"]
    value_regex: "{{fetch_or_run}}"
  message: "Composer script '{key}' fetches or runs code ({match}): {value}"
  rationale: >
    This script contains a download, a pipe into an interpreter or an encoded payload,
    so what runs may not be in the repository at all. Install and update scripts run
    without being asked for.
  recommendation: >
    Do not install as is. Read the script; if you need the dependencies, use `composer
    install --no-scripts`.
  references:
    - https://getcomposer.org/doc/articles/scripts.md
  tags: [php, composer, download]

- id: RC-AUTO-082
  title: Rust build script present
  area: autorun
  severity: low
  confidence: high
  files: ["**/build.rs"]
  exclude: [{set: vendored}, {set: test_data}, "**/vendor/**"]
  check:
    type: filename
  message: "{path} is Rust code that runs on every cargo build or check"
  rationale: >
    Cargo compiles and runs build.rs before building the package, also for `cargo
    check` and for IDE code analysis (rust-analyzer), with your user rights.
  recommendation: >
    Read build.rs before building or opening the project in an IDE with Rust support.
  references:
    - https://doc.rust-lang.org/cargo/reference/build-scripts.html
  tags: [rust, build]

- id: RC-AUTO-083
  title: Rust build script downloads code or starts a download tool
  area: autorun
  severity: medium
  confidence: medium
  files: ["**/build.rs"]
  exclude: [{set: vendored}, {set: test_data}, "**/vendor/**"]
  check:
    type: regex
    pattern: '{{download_exec}}|\b(?:reqwest|ureq|attohttpc|curl)::|\bstd::net::TcpStream\b|\bCommand::new\([ \t]*"(?:curl|wget|powershell|pwsh|certutil|bitsadmin)(?:\.exe)?"'
    ignore: "{{comment_line}}"
  message: "Build script reaches the network: {match}"
  rationale: >
    Cargo runs build.rs on every build, check and IDE analysis. This one downloads
    something or starts a download tool, so what it builds or runs is not fully in the
    repository. Some crates download prebuilt libraries this way on purpose.
  recommendation: >
    Read what is downloaded and what happens with it before building. `cargo build
    --offline` does not stop a build script from using the network.
  references:
    - https://doc.rust-lang.org/cargo/reference/build-scripts.html
  tags: [rust, build, download]

- id: RC-AUTO-084
  title: Gradle build starts external commands
  area: autorun
  severity: medium
  confidence: medium
  files:
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "**/settings.gradle"
    - "**/settings.gradle.kts"
    - "**/init.gradle"
    - "**/*.init.gradle"
    - "**/*.init.gradle.kts"
  exclude: [{set: vendored}, {set: test_data}]
  check:
    type: regex
    pattern: '(?:"|''|\))[ \t]*\.execute\(|\bRuntime\.getRuntime\(\)[ \t]*\.exec\(|\bProcessBuilder[ \t]*\(|\b(?:project\.)?exec[ \t]*(?:\{|\([ \t]*\{)|\bproviders\.exec[ \t]*\{|\bcommandLine[ \t]*(?:\(|[''"])'
    ignore: "{{comment_line}}"
  message: "Gradle build file runs a command: {match}"
  rationale: >
    Gradle runs build and settings scripts when the project is built, and IDEs such as
    IntelliJ IDEA and Android Studio run them when the project is opened or synced.
    This script starts external programs.
  recommendation: >
    Read the command before building or importing the project into an IDE.
  references:
    - https://docs.gradle.org/current/userguide/build_lifecycle.html
  tags: [gradle, build]

- id: RC-AUTO-085
  title: Gradle build downloads and runs code
  area: autorun
  severity: high
  confidence: high
  files:
    - "**/build.gradle"
    - "**/build.gradle.kts"
    - "**/settings.gradle"
    - "**/settings.gradle.kts"
    - "**/init.gradle"
    - "**/*.init.gradle"
    - "**/*.init.gradle.kts"
  exclude: [{set: vendored}, {set: test_data}]
  check:
    type: regex
    pattern: "{{download_exec}}|{{encoded_payload}}"
    ignore: "{{comment_line}}"
  message: "Gradle build file fetches or decodes code to run: {match}"
  rationale: >
    Gradle runs this script on build, and IDEs run it when the project is opened or
    synced. It runs code from the network or an encoded payload, which is not part of
    the repository.
  recommendation: >
    Do not build or import the project as is. Download and read the script first.
  references:
    - https://docs.gradle.org/current/userguide/build_lifecycle.html
  tags: [gradle, build, download]

- id: RC-AUTO-086
  title: Gradle wrapper downloads Gradle from an unofficial location
  area: autorun
  severity: medium
  confidence: medium
  files: ["**/gradle/wrapper/gradle-wrapper.properties"]
  exclude: [{set: vendored}, {set: test_data}]
  check:
    type: regex
    pattern: '\A[ \t]*distributionUrl[ \t]*[=:][ \t]*(?!https\\?://services\.gradle\.org/distributions/)\S[^\n]{0,200}'
  message: "Gradle wrapper fetches its distribution from elsewhere: {match}"
  rationale: >
    `./gradlew` and IDEs download and run the Gradle distribution named here. The
    official one comes from services.gradle.org; another location can serve a modified
    Gradle. Company mirrors are a legitimate reason.
  recommendation: >
    Check that the URL is a mirror you trust, or change it to services.gradle.org and
    set distributionSha256Sum.
  references:
    - https://docs.gradle.org/current/userguide/gradle_wrapper.html
  tags: [gradle, build, download]

- id: RC-AUTO-087
  title: Ruby gem builds a native extension on install
  area: autorun
  severity: low
  confidence: high
  files: ["**/*.gemspec"]
  exclude: [{set: vendored}, {set: test_data}, "**/vendor/**"]
  check:
    type: regex
    pattern: '\.extensions[ \t]*(?:=|<<|\+=|\.(?:push|concat)\b)'
    ignore: "{{comment_line}}"
  message: "Gemspec declares native extensions: {match}"
