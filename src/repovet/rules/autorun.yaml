  recommendation: >
    Read the hook file before installing from source.
  references:
    - https://hatch.pypa.io/latest/plugins/build-hook/custom/
  tags: [python, build]

- id: RC-AUTO-016
  title: .pth file with code
  area: autorun
  severity: high
  confidence: high
  files: ["**/*.pth"]
  exclude: [{set: vendored}, {set: test_data}]
  check:
    type: regex
    pattern: '\A[ \t]*import[ \t]'
  message: ".pth file runs code at every Python start: {match}"
  rationale: >
    Lines starting with `import` in a .pth file run each time Python starts once the
