# --- M2e: Windows, Git, CI, MSBuild ------------------------------------------------------

- id: RC-AUTO-051
  title: Windows shortcut in the repository
  area: autorun
  severity: medium
  confidence: high
  files: ["**/*.lnk"]
  exclude: [{set: vendored}]
  check:
    type: filename
  message: "{path} is a Windows shortcut that can start any program"
  rationale: >
    A shortcut runs its target with arguments when double-clicked and can look like a
    document. Source repositories rarely need one.
  recommendation: >
    Do not open it. Inspect its target with a tool that shows shortcut properties.
  references:
    - https://attack.mitre.org/techniques/T1204/002/
  tags: [windows]

- id: RC-AUTO-033
  title: .gitattributes assigns a custom filter, diff or merge driver
  area: autorun
  severity: low
  confidence: medium
  files: ["**/.gitattributes", "**/.git/info/attributes"]
  exclude: [{set: vendored}]
  check:
    type: regex
    ignore: '\A[ \t]*#'
    pattern: '(?<![\w-])(?:filter|diff|merge)=(?!lfs\b|binary\b|text\b|union\b|java\b|python\b|cpp\b|csharp\b|css\b|html\b|golang\b|rust\b|php\b|ruby\b|markdown\b|bash\b)[\w.-]+'
  message: "Git driver assigned: {match}"
  rationale: >
    The driver itself is a command in a Git configuration, not in the repository. It
    only runs if you (or an install script or README) configure it; then Git runs it on
    checkout, diff or merge.
  recommendation: >
    Do not add a Git configuration for this driver unless you have read what it runs.
  references:
    - https://git-scm.com/docs/gitattributes#_filter
  tags: [git]

- id: RC-AUTO-060
  title: GitHub workflow runs pull request code with pull_request_target
  area: autorun
  severity: medium
  confidence: medium
  files: [".github/workflows/*.yml", ".github/workflows/*.yaml"]
  check:
    type: regex
    pattern: '\bref:[ \t]*["'']?\$\{\{[ \t]*(?:github\.event\.pull_request\.head\.(?:sha|ref)|github\.head_ref)\b|\bgh[ \t]+pr[ \t]+checkout\b'
    file_requires: ['\bpull_request_target\b']
  message: "Checks out the pull request in a privileged workflow: {match}"
  rationale: >
    pull_request_target runs with the repository's secrets and write token. Checking
    out and building the pull request's code there lets any outside contributor run
    code with those rights ("pwn request"). This affects the repository's maintainers
    and users of its releases, not your machine directly.
  recommendation: >
    Treat releases built by this workflow with care. Maintainers should use
    pull_request or keep untrusted code away from secrets.
  references:
    - https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
  tags: [ci, github-actions]

- id: RC-AUTO-061
  title: GitHub workflow runs an encoded command
  area: autorun
  severity: medium
  confidence: medium
  files: [".github/workflows/*.yml", ".github/workflows/*.yaml", "**/action.yml", "**/action.yaml"]
  exclude: [{set: vendored}]
  check:
    type: regex
    ignore: '\A[ \t]*#'
    # Decoding into a file (certificates, API content) is common; only decoding
    # straight into a shell, eval or PowerShell is reported.
    pattern: >-
      (?i:\bbase64[ \t]+(?:-d|--decode|-D)\b[^\n]{0,80}\|[ \t]*(?:sudo[ \t]+)?(?:ba|z|da|k)?sh\b|\b(?:eval|(?:ba|z|da|k)?sh[ \t]+-c)[ \t]+["']?\$\([^\n]{0,80}\bbase64[ \t]+(?:-d|--decode|-D)\b|\bpowershell(?:\.exe)?\b[^\n]{0,80}[ \t]-(?:e|ec|en|enc|encodedcommand)[ \t]+[A-Za-z0-9+/]{40,}|\bFromBase64String\b[^\n]{0,200}\|[ \t]*(?:iex|Invoke-Expression)\b)
  message: "Decodes and runs a payload in CI: {match}"
  rationale: >
    Decoding Base64 or encoded PowerShell inside a workflow hides what the CI job runs
    from reviewers. Workflows run on GitHub's machines, but they can publish releases
    and use the repository's secrets.
  recommendation: >
    Decode the value by hand and check what the step runs.
  references:
    - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions
  tags: [ci, github-actions, obfuscation]

- id: RC-AUTO-070
  title: MSBuild project runs a command on build
  area: autorun
  severity: medium
  confidence: high
  files: [{set: msbuild_files}]
  exclude: [{set: vendored}]
  check:
    type: regex
    scope: text
    pattern: '<Exec\b[^>]{0,500}?\bCommand[ \t]*=[ \t]*"[^"]{1,300}'
  message: "Build runs a command: {match}"
  rationale: >
    MSBuild runs Exec tasks during builds, including builds that Visual Studio and
    other IDEs start in the background after opening the project.
  recommendation: >
    Read the command and the target it belongs to before opening the project in an IDE
    or building it.
  references:
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/exec-task
  tags: [msbuild, build]

- id: RC-AUTO-071
  title: MSBuild project downloads or decodes code during the build
  area: autorun
  severity: high
  confidence: high
  files: [{set: msbuild_files}]
  exclude: [{set: vendored}]
  check:
    type: regex
    scope: text
    pattern: '<Exec\b[^>]{0,500}?\bCommand[ \t]*=[ \t]*"[^"]{0,300}?(?:{{fetch_or_run}})|<DownloadFile\b'
  message: "Build fetches or runs remote code: {match}"
  rationale: >
    The build downloads something, pipes into an interpreter or decodes a payload, so
    what runs is not in the repository. Builds can start automatically when the project
    is opened in an IDE.
  recommendation: >
    Do not open or build the project until you have read the target and its download.
  references:
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/exec-task
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/downloadfile-task
  tags: [msbuild, build, download]

- id: RC-AUTO-072
  title: MSBuild inline task with code
  area: autorun
  severity: high
  confidence: medium
  files: [{set: msbuild_files}]
  exclude: [{set: vendored}]
  check:
    type: regex
    scope: text
    pattern: '<UsingTask\b[^>]{0,500}?\bTaskFactory[ \t]*=[ \t]*"(?:RoslynCodeTaskFactory|CodeTaskFactory)"'
  message: "Project defines an inline C#/VB task: {match}"
  rationale: >
    Inline tasks contain source code that MSBuild compiles and runs during the build,
    a known way to run arbitrary code when a project is built or loaded.
  recommendation: >
    Read the <Code> element of the task before building or opening the project.
  references:
    - https://learn.microsoft.com/en-us/visualstudio/msbuild/msbuild-roslyncodetaskfactory
  tags: [msbuild, build]
