- id: RC-AUTO-017
  title: sitecustomize.py or usercustomize.py in the repository
  area: autorun
  severity: high
  confidence: medium
  files: ["**/sitecustomize.py", "**/usercustomize.py"]
  exclude: [{set: vendored}, {set: test_data}]
  check:
    type: filename
  message: "{path} runs at Python start-up if it is on the module path"
  rationale: >
    Python imports these modules automatically at start-up when they are on the path,
    for example when installed or when a tool adds the folder to PYTHONPATH.
  recommendation: >
    Read the file; do not add its folder to PYTHONPATH or install it unless you trust it.
  references:
    - https://docs.python.org/3/library/site.html#module-sitecustomize
  tags: [python]

# --- M2e: dev containers, direnv, mise -----------------------------------------------------

