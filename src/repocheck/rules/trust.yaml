# Trust indicators (RC-TRUST). Facts come from the GitHub API (facts.trust, see
# docs/report.schema.json); without the API (--offline, no GitHub repository known, rate
# limit) these rules do not run, and the report says so under "Not checked".
#
# Stars, forks, followers and accounts can be bought or faked, and every pattern here
# also has harmless causes. The rules are kept narrow, stay at info, low or medium, and
# the wording says "indicator" and "may". There is no score and no verdict.

- id: RC-TRUST-001
  title: Very new owner account with a popular repository
  area: trust
  severity: medium
  confidence: medium
  check:
    type: metric
    conditions:
      - {fact: trust.owner.age_days, op: "<", value: 30}
      - {fact: trust.repository.stars, op: ">=", value: 50}
    show:
      value: trust.owner.age_days
      count: trust.repository.stars
  message: >-
    The owner's account is {value} day(s) old, but the repository already has {count}
    stars; this is an indicator that the stars may not be genuine
  rationale: >
    Real projects collect stars over time, usually from an account that has existed
    for a while. A brand-new account with a popular repository is a common pattern of
    fake projects that bought stars to look trustworthy, often to spread malware. It
    can also be a new account for a project that moved or launched successfully.
  recommendation: >
    Do not rely on the star count. Look at who the stargazers are, whether the
    project is mentioned elsewhere, and read the code and releases before using them.
  references:
    - https://docs.github.com/en/rest/users/users#get-a-user
  tags: [github, stars, account]

- id: RC-TRUST-002
  title: Young repository with many stars
  area: trust
  severity: low
  confidence: low
  check:
    type: metric
    conditions:
      - {fact: trust.repository.age_days, op: "<", value: 30}
      - {fact: trust.repository.stars, op: ">=", value: 500}
    show:
      value: trust.repository.age_days
      count: trust.repository.stars
  message: >-
    The repository is {value} day(s) old and has {count} stars; such fast growth may
    be a successful launch or bought stars (indicator)
  rationale: >
    Hundreds of stars within a few weeks happen for launches that reach a large
    audience, but buying stars produces the same picture. Stars alone say little
    about a young repository.
  recommendation: >
    Check where the attention comes from (announcements, articles, the organization
    behind it) instead of trusting the star count.
  tags: [github, stars]

- id: RC-TRUST-003
  title: Most stars arrived within one day
  area: trust
  severity: low
  confidence: low
  check:
    type: metric
    conditions:
      - {fact: trust.stars.complete, op: "==", value: true}
      - {fact: trust.stars.sampled, op: ">=", value: 50}
      - {fact: trust.stars.max_24h_share, op: ">=", value: 0.8}
    show:
      value: trust.stars.max_24h
      count: trust.stars.sampled
  message: >-
    {value} of {count} stars arrived within 24 hours; a burst like this may come from
    a single mention or from bought stars (indicator)
  rationale: >
    Bought stars are often delivered in one batch. A link from a news site or a
    social network can cause the same burst, so this is a weak indicator on its own.
    repocheck looks at star times only for 50 to 200 stars, when all of them fit into
    two API requests.
  recommendation: >
    Look at the stargazer accounts on GitHub: many new or empty accounts point to
    bought stars.
  references:
    - https://docs.github.com/en/rest/activity/starring#list-stargazers
  tags: [github, stars]

- id: RC-TRUST-004
  title: Fork of a much more popular repository
  area: trust
  severity: medium
  confidence: medium
  check:
    type: metric
    conditions:
      - {fact: trust.repository.fork, op: "==", value: true}
      - {fact: trust.repository.parent_stars, op: ">=", value: 100}
      - {fact: trust.repository.parent_star_ratio, op: ">=", value: 10}
    show:
      match: trust.repository.parent
      count: trust.repository.parent_stars
  message: >-
    This repository is a fork of {match} ({count} stars); you may have meant the
    original (indicator)
  rationale: >
    Forks carry the name, description and README of the original, so they are easy to
    mistake for it in search results or links. Attackers fork popular projects, add
    malicious changes and promote the fork. Most forks are harmless copies for
    contributions or experiments.
  recommendation: >
    Use the original repository unless you need this fork on purpose. Compare the fork
    with the original on GitHub to see what it changes.
  references:
    - https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/about-forks
  tags: [github, fork, copy]

- id: RC-TRUST-005
  title: Release offers programs or archives, but the repository has hardly any code
  area: trust
  severity: medium
  confidence: medium
  check:
    type: metric
    conditions:
      - {fact: trust.activity.latest_release.binary_assets, op: ">=", value: 1}
      - {fact: trust.code_files, op: "<=", value: 2}
      - {fact: trust.repository.age_days, op: "<", value: 365}
    show:
      value: trust.activity.latest_release.tag
      count: trust.activity.latest_release.binary_assets
  message: >-
    The latest release ({value}) offers {count} program or archive download(s), but the
    repository contains hardly any code; the download may not be built from this
    repository (indicator)
  rationale: >
    A young repository with a README and a release that offers an installer, a program
    or an archive, but no source code to build it from, is a common way to hand out
    malware ("download the release"). Closed-source tools sometimes publish their
    downloads the same way.
  recommendation: >
    Do not run the download. If you need the program, get it from a source you can
    verify, and scan the file before opening it.
  references:
    - https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases
  tags: [github, releases, binaries]

- id: RC-TRUST-006
  title: Repository is archived
  area: trust
  severity: info
  confidence: high
  check:
    type: metric
    conditions:
      - {fact: trust.repository.archived, op: "==", value: true}
  message: >-
    The repository is archived (read-only); it no longer receives changes, including
    security fixes
  rationale: >
    Archived repositories are no longer maintained by their owner. Problems found
    later stay unfixed.
  recommendation: >
    Look for a maintained successor or fork before depending on this code.
  references:
    - https://docs.github.com/en/repositories/archiving-a-github-repository/archiving-repositories
  tags: [github, maintenance]

- id: RC-TRUST-007
  title: No commits for more than two years
  area: trust
  severity: info
  confidence: medium
  check:
    type: metric
    conditions:
      - {fact: trust.activity.days_since_commit, op: ">=", value: 730}
      - {fact: trust.repository.archived, op: "==", value: false}
    show:
      value: trust.activity.last_commit
  message: >-
    The last commit on the default branch is from {value}; the project may no longer be
    maintained (indicator)
  rationale: >
    Without recent commits, bug and security fixes are unlikely. Some small, finished
    tools need no changes, so this is only an indicator.
  recommendation: >
    Check open issues and whether a maintained fork exists before depending on it.
  tags: [github, maintenance]

- id: RC-TRUST-008
  title: Local HEAD commit not found in the named GitHub repository
  area: trust
  severity: low
  confidence: medium
  check:
    type: metric
    conditions:
      - {fact: trust.local.head_found, op: "==", value: false}
    show:
      value: trust.local.head
      match: trust.repository.full_name
  message: >-
    The folder's HEAD commit {value} is not known in {match}, which its Git remote
    names; the trust profile may not describe the code in this folder (indicator)
  rationale: >
    A local folder names its GitHub repository only through a Git remote, which
    whoever prepared the folder can set to any repository, for example to a popular
    one. If GitHub does not know the folder's HEAD commit, the folder contains local
    changes or comes from somewhere else.
  recommendation: >
    Treat the trust profile as unrelated to this folder. Compare the folder with the
    repository, or check the repository itself by URL.
  tags: [github, local]

- id: RC-TRUST-009
  title: Manifest names another owner's repository as the project's source
  area: trust
  severity: medium
  confidence: medium
  check:
    type: metric
    conditions:
      - {fact: trust.manifest.other, op: "!=", value: ""}
    show:
      value: trust.manifest.other_file
      match: trust.manifest.other
  message: >-
    {value} names {match} as the project's repository; this repository may be a copy
    of that project (indicator)
  rationale: >
    Copies of popular packages often keep the original's package.json or
    pyproject.toml, including its repository link. Forks, templates and renamed or
    transferred repositories are not counted. A project can also link to an upstream
    repository on purpose.
  recommendation: >
    Compare with the repository the manifest names. If that is the original, use it
    instead of this copy.
  references:
    - https://docs.npmjs.com/cli/configuring-npm/package-json#repository
    - https://packaging.python.org/en/latest/specifications/well-known-project-urls/
  tags: [github, copy, manifest]

- id: RC-TRUST-010
  title: Older, more popular repository with the same name and description
  area: trust
  severity: medium
  confidence: medium
  check:
    type: metric
    conditions:
      - {fact: trust.lookalike.older, op: "==", value: true}
      - {fact: trust.lookalike.stars, op: ">=", value: 100}
      - {fact: trust.lookalike.star_ratio, op: ">=", value: 10}
    show:
      match: trust.lookalike.full_name
      count: trust.lookalike.stars
  message: >-
    {match} ({count} stars) is older and has the same name and description; this
    repository may be a copy of it (indicator)
  rationale: >
    Copies of popular projects keep their name and description to be found in search
    results; some of them add malicious changes. Two unrelated projects rarely share
    both name and description word for word.
  recommendation: >
    Compare with the other repository. If it is the original, use it instead of this
    copy.
  references:
    - https://docs.github.com/en/rest/search/search#search-repositories
  tags: [github, copy]
