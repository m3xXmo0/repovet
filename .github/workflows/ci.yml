name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macOS runner minutes are expensive: macOS runs on pushes to main only.
        os: >-
          ${{ github.event_name == 'push'
          && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
          || fromJSON('["ubuntu-latest", "windows-latest"]') }}
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run mypy src tests scripts
      - name: mypy for macOS (pull requests run without macOS)
        if: runner.os == 'Linux'
        run: uv run mypy --platform darwin src tests scripts
      - run: uv run ruff check
      - run: uv run ruff format --check

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          python-version: "3.12"
      - run: uv build
      - run: uv run --no-project python scripts/check_dist.py dist
      - name: Install the wheel as a tool
        run: |
          uv tool install dist/repocheck-*.whl
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Run the installed tool outside the project
        working-directory: ${{ runner.temp }}
        run: |
          repocheck --help > /dev/null
          repocheck rules list > /dev/null
          mkdir sample && printf 'print("hello")\n' > sample/hello.py
          repocheck scan sample --offline --no-color
