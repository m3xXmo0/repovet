name: Demo GIF

# Manual only. Installs repovet from this repository's code, renders docs/demo.tape
# with the official VHS action, and uploads the resulting GIF as an artifact.
# It never commits anything. The demo repository it scans must already be published
# at https://github.com/m3xXmo0/repovet-demo.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  render:
    name: Render demo GIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: false
      - name: Install repovet from this repository
        run: |
          uv tool install .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Render the tape
        uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/demo.tape
          version: v0.12.1
        env:
          # Passed to repovet so the GitHub trust API is not rate-limited. repovet reads
          # GITHUB_TOKEN or GH_TOKEN and never prints the token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the GIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-gif
          path: docs/demo.gif
          if-no-files-found: error
          retention-days: 7
