id: event-stream
title: event-stream / flatmap-stream
kind: incident
year: 2018
technique: >
  A new maintainer added the dependency flatmap-stream to the popular npm package
  event-stream. flatmap-stream's minified code read AES-encrypted data from a file
  disguised as a test fixture, decrypted it with the description of the importing
  package as key, and compiled the result in memory as a module.
sources:
  - https://github.com/advisories/GHSA-mh6f-8j2x-4483
  - https://blog.npmjs.org/post/180565383195/details-about-the-event-stream-incident
  - https://github.com/dominictarr/event-stream/issues/116
reconstruction: >
  The dependency package reduced to the shape the rules look at: an entry file with a
  function that decrypts a string and hands the result to Node's module compiler, and a
  data file posing as test data. Names and structure are new, not the original loader;
  the function is never called, the key is not read from the environment, and the data
  is a short run of zeros instead of ciphertext.
files:
  package.json: |
    {"name": "flatmap-stream", "version": "0.1.1", "main": "index.min.js"}
  index.min.js: |
    const { Readable } = require("stream");
    module.exports = () => new Readable({ read() {} });

    function unpackExtra(hexText, secret) {
      const cipher = require("crypto").createDecipheriv("aes-256-cbc", secret, Buffer.alloc(16));
      const source = cipher.update(hexText, "hex", "utf8") + cipher.final("utf8");
      const extra = new module.constructor();
      extra._compile(source, "extra.js");
      return extra.exports;
    }
    module.exports.unpackExtra = unpackExtra;
  test/data.js: |
    module.exports = ["00000000000000000000000000000000"];
must_fire:
  - {rule: RC-OBF-011, path: index.min.js}
must_not_fire: [RC-AUTO-001, RC-DEP-001, RC-OBF-003]
not_covered: >
  The payload sat in the published npm package, which repovet does not download; a
  scan of event-stream's own repository shows only a new dependency. Encrypted data
  in hex form is not reported (RC-OBF-001 looks at high-entropy Base64 only). The
  decryption and the compile step are separate statements, so the one-expression rule
  RC-OBF-003 stays silent; RC-OBF-011 reports them as a pair in one file.
