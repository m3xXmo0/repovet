id: pytorch-torchtriton
title: PyTorch nightly torchtriton dependency confusion
kind: incident
year: 2022
technique: >
  PyTorch nightly builds depended on torchtriton from PyTorch's own package index.
  Someone registered the same name on PyPI; because pip prefers PyPI when an extra
  index is configured, installs pulled the malicious package, whose binary uploaded
  system information and files from the home directory.
sources:
  - https://pytorch.org/blog/compromised-nightly-dependency/
reconstruction: >
  A requirements file that adds an extra package index next to PyPI and installs a
  package expected from that index. The index host is a placeholder.
files:
  requirements.txt: |
    --extra-index-url https://download.example.invalid/whl/nightly
    torch
    torchtriton
must_fire:
  - {rule: RC-DEP-011, path: requirements.txt}
must_not_fire: [RC-DEP-001, RC-DEP-012]

variants:
  - id: index-url
    technique: The default index is replaced with --index-url instead of adding one.
    files:
      requirements.txt: |
        --index-url https://download.example.invalid/whl/nightly
        torch
        torchtriton
  - id: nested-requirements
    technique: The extra index sits in a second requirements file that the first one includes.
    files:
      requirements.txt: |
        -r requirements/nightly.txt
        torch
      requirements/nightly.txt: |
        --extra-index-url https://download.example.invalid/whl/nightly
        torchtriton
  - id: uv-index
    technique: The extra index is configured for uv in pyproject.toml instead of requirements.txt.
    files:
      requirements.txt: null
      pyproject.toml: |
        [project]
        name = "demo"
        version = "0.1.0"
        dependencies = ["torch", "torchtriton"]

        [[tool.uv.index]]
        name = "nightly"
        url = "https://download.example.invalid/whl/nightly"
