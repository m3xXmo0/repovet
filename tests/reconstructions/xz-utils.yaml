id: xz-utils
title: xz-utils backdoor (CVE-2024-3094)
kind: incident
year: 2024
technique: >
  A co-maintainer committed two "test files" (bad-3-corrupt_lzma2.xz,
  good-large_compressed.lzma) that carried an obfuscated payload. A modified
  build-to-host.m4, shipped only in the release tarballs, ran at the end of configure:
  it read the test file, undid a tr byte mapping, decompressed it with xz and piped the
  result into a shell, which injected the backdoor into the liblzma build.
sources:
  - https://www.openwall.com/lists/oss-security/2024/03/29/4
  - https://nvd.nist.gov/vuln/detail/CVE-2024-3094
reconstruction: >
  Two test files with valid xz/lzma headers followed by harmless text, and an m4 macro
  with the shape of the extraction pipeline (sed | tr | xz -d | sh) that only echoes.
files:
  tests/files/bad-3-corrupt_lzma2.xz: {base64: /Td6WFoAAATm1rRGZHVtbXkgdGVzdCBkYXRhLCBub3QgYSBwYXlsb2Fk}
  tests/files/good-large_compressed.lzma: {base64: XQAAgAD//////////2R1bW15IHRlc3QgZGF0YSwgbm90IGEgcGF5bG9hZA==}
  m4/build-to-host.m4: |
    # build-to-host.m4 (reconstruction of the shape only)
    AC_DEFUN([gl_BUILD_TO_HOST_INIT],
    [
      gl_am_configmake=tests/files/bad-3-corrupt_lzma2.xz
      gl_path_map='tr "\t \-_" " \t_\-"'
      gl_config='sed "r\n" $gl_am_configmake | eval $gl_path_map | xz -d 2>/dev/null | sh'
      AC_CONFIG_COMMANDS([build-to-host], [echo dummy], [eval $gl_config])
    ])
must_fire:
  - {rule: RC-BIN-006, path: tests/files/bad-3-corrupt_lzma2.xz}
  - {rule: RC-OBF-003, path: m4/build-to-host.m4}
must_not_fire: [RC-BIN-001, RC-OBF-001]
not_covered: >
  The m4 loader existed only in the release tarballs, not in Git, so a scan of the
  repository sees only the test files (archives, reported as low). The .lzma file has
  no signature repovet knows. Beyond decode-and-run pipelines, autoconf/m4 build logic
  is not analyzed.
