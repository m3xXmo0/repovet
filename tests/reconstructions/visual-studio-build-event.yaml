id: visual-studio-build-event
title: Visual Studio project with a build event (campaign against security researchers)
kind: incident
year: 2021
technique: >
  Attackers posing as researchers shared a Visual Studio project for an exploit. A
  build event in the project ran a precompiled DLL shipped with it, a backdoor that
  contacted the attackers' servers, as soon as the project was built.
sources:
  - https://blog.google/threat-analysis-group/new-campaign-targeting-security-researchers/
reconstruction: >
  A .vcxproj whose PreBuildEvent starts a bundled DLL with rundll32, and the DLL as a
  minimal PE header without code, stored under a non-executable file extension.
files:
  Exploit.vcxproj: |
    <?xml version="1.0" encoding="utf-8"?>
    <Project DefaultTargets="Build" ToolsVersion="16.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
      <ItemDefinitionGroup Condition="'$(Configuration)|$(Platform)'=='Release|x64'">
        <PreBuildEvent>
          <Command>rundll32.exe "$(ProjectDir)lib\helper.db",Start</Command>
        </PreBuildEvent>
      </ItemDefinitionGroup>
      <ItemGroup>
        <ClCompile Include="main.cpp" />
      </ItemGroup>
    </Project>
  main.cpp: |
    int main() { return 0; }
  lib/helper.db: {base64: TVoAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAFBFAABkhgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
must_fire:
  - {rule: RC-BIN-001, path: lib/helper.db}
  - {rule: RC-AUTO-070, path: Exploit.vcxproj}
must_not_fire: [RC-DLX-002]

variants:
  - id: post-build-event
    technique: The command runs as a PostBuildEvent instead of a PreBuildEvent.
    files:
      Exploit.vcxproj: |
        <?xml version="1.0" encoding="utf-8"?>
        <Project DefaultTargets="Build" ToolsVersion="16.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
          <ItemDefinitionGroup>
            <PostBuildEvent>
              <Command>rundll32.exe "$(ProjectDir)lib\helper.db",Start</Command>
            </PostBuildEvent>
          </ItemDefinitionGroup>
          <ItemGroup>
            <ClCompile Include="main.cpp" />
          </ItemGroup>
        </Project>
  - id: exec-target
    technique: A custom target with an Exec task before the build instead of a build event.
    files:
      Exploit.vcxproj: |
        <?xml version="1.0" encoding="utf-8"?>
        <Project DefaultTargets="Build" ToolsVersion="16.0" xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
          <Target Name="Prepare" BeforeTargets="Build">
            <Exec Command="rundll32.exe &quot;$(ProjectDir)lib\helper.db&quot;,Start" />
          </Target>
          <ItemGroup>
            <ClCompile Include="main.cpp" />
          </ItemGroup>
        </Project>
  - id: csproj
    technique: The same build event in a C# project file.
    files:
      Exploit.vcxproj: null
      Exploit.csproj: |
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <OutputType>Exe</OutputType>
            <PreBuildEvent>rundll32.exe "$(ProjectDir)lib\helper.db",Start</PreBuildEvent>
          </PropertyGroup>
        </Project>
