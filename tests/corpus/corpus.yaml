- name: pip
  repo: pypa/pip
  commit: "1000636"
  why: Python; vendored libraries with executables, test data with sample packages, wheels and archives
  accepted:
    - rule: RC-BIN-001
      path: src/pip/_vendor/distlib/t32.exe
      reason: distlib's script launchers, vendored by pip and installed as console-script
        wrappers on Windows; real executables, built from the separate simple_launcher project
    - rule: RC-BIN-001
      path: src/pip/_vendor/distlib/t64.exe
      reason: distlib's script launchers, vendored by pip and installed as console-script
        wrappers on Windows; real executables, built from the separate simple_launcher project
    - rule: RC-BIN-001
      path: src/pip/_vendor/distlib/t64-arm.exe
      reason: distlib's script launchers, vendored by pip and installed as console-script
        wrappers on Windows; real executables, built from the separate simple_launcher project
    - rule: RC-BIN-001
      path: src/pip/_vendor/distlib/w32.exe
      reason: distlib's script launchers, vendored by pip and installed as console-script
        wrappers on Windows; real executables, built from the separate simple_launcher project
    - rule: RC-BIN-001
      path: src/pip/_vendor/distlib/w64.exe
      reason: distlib's script launchers, vendored by pip and installed as console-script
        wrappers on Windows; real executables, built from the separate simple_launcher project
    - rule: RC-BIN-001
      path: src/pip/_vendor/distlib/w64-arm.exe
      reason: distlib's script launchers, vendored by pip and installed as console-script
        wrappers on Windows; real executables, built from the separate simple_launcher project

