# False-positive corpus: well-known, maintained
# repositories with .vscode, .devcontainer or agent files (M1c) and with vendored code,
# binaries, archives, lockfiles and MSBuild projects (M2f). The scan of each must not produce
# high/critical findings, except those listed under `accepted` with a reason.
# See README.md in this folder for how to download them (or scan them by URL, M3);
# tests never use the network.

- name: flask
  repo: pallets/flask
  commit: d086db8
  why: Python; .devcontainer, pre-commit, setup tooling
  accepted: []

