# False-positive corpus: well-known, maintained
# repositories with .vscode, .devcontainer or agent files (M1c) and with vendored code,
# binaries, archives, lockfiles and MSBuild projects (M2f), and a security scanner whose
# detection patterns and test fixtures look like attacks (0.2.0). The scan of each must
# not produce high/critical findings, except those listed under `accepted` with a reason.
# Commits are full ids, so the repositories can also be scanned by URL with --ref
# (scripts/corpus_counts.py).
# See README.md in this folder for how to download them (or scan them by URL, M3);
# tests never use the network.

