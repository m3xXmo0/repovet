        src/client/locales.ts: "export const ru = {\n  installFailed: 'pnpm \U00000431\U0000043B\U0000043E\U0000043A\U00000438\U00000440\U0000043E\U00000432\U00000430\U0000043B \U00000440\U00000430\U00000437\U00000434\U00000435\U0000043B\U00000435allowBuilds \U00000432 pnpm-workspace.yaml',\n  detail: '\U00000417\U00000430\U00000432\U00000435\U00000440\U00000448\U00000435\U0000043D\U0000043E.\\n\\n\U0000041E\U00000431\U0000043D\U0000043E\U00000432\U0000043B\U00000435\U0000043D\U00000438\U00000435 Windows',\n};\n"
    - name: mixed words in comments and docstrings
      files:
        app/util.py: "# \U00000441\U0000043C. config\U00000444\U00000430\U00000439\U0000043B\ndef f():\n    \"\"\"\U0000041F\U00000440\U00000438\U0000043C\U00000435\U00000440 Windows\U00000435 x\"\"\"\n"
        web/app.ts: "/* \U00000442\U00000435\U00000441\U00000442test */\nconst t = `\U00000437\U00000430\U00000433\U00000440\U00000443\U00000437\U0000043A\U00000430file`;\n"
    - name: translations and math names in one script each
      files:
        i18n.py: "HELLO = '\U0000041F\U00000440\U00000438\U00000432\U00000435\U00000442'\nx_\U000003B1 = 0.5\nNAME = 'M\U000000FCller'\n"
