RC-OBF-010:
  positive:
    - name: function name with a Cyrillic letter
      files:
        auth.py: "def is_\U00000430dmin(user):\n    return True\n"
      expect: [{path: auth.py, line: 1}]
    - name: look-alike domain in a string
      files:
        src/update.js: "const host = 'https://g\U0000043Eogle.example.invalid/x';\n"
      expect: [{path: src/update.js, line: 1}]
    - name: look-alike package name in require and import
      files:
        src/a.js: "const _ = require('l\U0000043Edash');\n"
        pkg/b.py: "from r\U00000435quests import get\n"
      expect: [{path: src/a.js, line: 1}, {path: pkg/b.py, line: 1}]
