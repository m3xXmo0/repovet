RC-AUTO-031:
  positive:
    - name: core.hooksPath points to repository hooks
      files:
        .git/config: |
          [core]
          	repositoryformatversion = 0
          	hooksPath = .githooks
      expect: [{path: .git/config, line: 3}]
    - name: shell alias
      files:
        .git/config: |
          [alias]
          	st = !sh -c 'echo status'
      expect: [{path: .git/config, line: 2}]
    - name: custom filter driver
      files:
        .git/config: |
          [filter "demo"]
          	smudge = python tools/smudge.py
      expect: [{path: .git/config, line: 2}]
  negative:
    - name: configuration of a fresh clone
      files:
        .git/config: |
          [core]
          	repositoryformatversion = 0
          	filemode = false
          	bare = false
          	logallrefupdates = true
          	symlinks = false
          	ignorecase = true
          [remote "origin"]
          	url = https://example.invalid/demo.git
          	fetch = +refs/heads/*:refs/remotes/origin/*
          [branch "main"]
          	remote = origin
          	merge = refs/heads/main
    - name: Git LFS, built-in credential helper, plain aliases and pager switches
      files:
        .git/config: |
          [filter "lfs"]
          	clean = git-lfs clean -- %f
          	smudge = git-lfs smudge -- %f
          	process = git-lfs filter-process
          	required = true
          [credential]
          	helper = manager
          [alias]
          	st = status
          [pager]
          	log = false

