    - name: unknown build backend
      files:
        pyproject.toml: |
          [build-system]
          requires = ["demo-backend"]
          build-backend = "demo_backend.api"
      expect: [{path: pyproject.toml, line: 3}]
  negative:
    - name: hatchling backend
      files:
        pyproject.toml: |
          [build-system]
          requires = ["hatchling"]
          build-backend = "hatchling.build"
    - name: setuptools legacy backend
      files:
        pyproject.toml: |
          [build-system]
          build-backend = "setuptools.build_meta:__legacy__"
    - name: no build-system table
      files:
        pyproject.toml: "[project]\nname = \"demo\"\n"

RC-AUTO-014:
  positive:
