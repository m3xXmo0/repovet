RC-AGENT-050:
  positive:
    - name: slash command with embedded shell
      files:
        .claude/commands/release.md: |
          ---
          description: Release
          ---
          Current status: !`git status`
      expect: [{path: .claude/commands/release.md, line: 4}]
    - name: skill with unrestricted Bash
      files:
        skills/deploy/SKILL.md: |
          ---
          name: deploy
          allowed-tools: Read, Bash
          ---
      expect: [{path: skills/deploy/SKILL.md, line: 3}]
  negative:
    - name: restricted tools and inline code
      files:
        .claude/commands/test.md: |
          ---
          allowed-tools: Bash(npm test:*), Read
          ---
          Run `npm test` and summarize.

RC-AGENT-060:
  positive:
    - name: Codex without approvals
      files:
        .codex/config.toml: |
          approval_policy = "never"
          sandbox_mode = "danger-full-access"
      expect: [{path: .codex/config.toml, line: 1}, {path: .codex/config.toml, line: 2}]
    - name: aider runs repository commands
      files:
        .aider.conf.yml: |
          yes-always: true
          test-cmd: ./scripts/test.sh
      expect: [{path: .aider.conf.yml, line: 1}, {path: .aider.conf.yml, line: 2}]
  negative:
    - name: safe settings
      files:
        .codex/config.toml: |
          approval_policy = "on-request"
          sandbox_mode = "workspace-write"
        .aider.conf.yml: |
          # yes-always: true
          model: example
